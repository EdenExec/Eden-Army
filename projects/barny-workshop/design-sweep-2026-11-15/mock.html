<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barny's Workshop (design mock)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: a quiet study room. A slim rail of rooms on the left (tabs on a phone), one reading column in the middle, a margin column for the rhythm and notes. */
:root{
  /* Eden visual system (workshop/brand/eden.ts), KDTW identity: cream and white, ink lettering, ink as the only accent; semantic colours mark state only. */
  --bg:#FAF8F3; --page:#FFFFFF; --ink:#111111; --mute:#5A5A5A; --line:#D9D6CE; --soft:#F0EDE6;
  --accent:#111111; --accent-ink:#FFFFFF; --pos:#3D6B4F; --warn:#7A5A1C; --rec:#9A3B30; --amb:#A87A2A;
  --display:'Cinzel',Georgia,serif;   /* the title only (Kev, 2 Nov: "very greek inspired ancient text, all good there") */
  --read:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --ui:'Montserrat','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--page:#1D1D1C;--ink:#F2F0EA;--mute:#A3A09A;--line:#2F2F2D;--soft:#232321;--accent:#F2F0EA;--accent-ink:#111111;--pos:#7DB391;--warn:#D2A95C;--rec:#C77467;--amb:#D2A95C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151515;--page:#1D1D1C;--ink:#F2F0EA;--mute:#A3A09A;--line:#2F2F2D;--soft:#232321;--accent:#F2F0EA;--accent-ink:#111111;--pos:#7DB391;--warn:#D2A95C;--rec:#C77467;--amb:#D2A95C;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--ui);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px}
header.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
a.home{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--ui);color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--page);border-radius:4px;padding:9px 14px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px} .room-h>.top-right{margin-left:auto}
a.home:hover{background:var(--soft)} a.home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:600 26px/1.1 var(--display);letter-spacing:.08em;margin:0}
.sub{color:var(--mute);font-size:13px}
.eyebrow{font:600 11px/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;min-width:0;max-height:calc(100vh - 32px);overflow:auto}
/* Rooms menu (design sweep, 15 Nov): one line icon per room, two quiet groups, the current room marked by an ink rule, counts as small tabular figures. */
nav.rooms{display:flex;flex-direction:column;gap:1px}
nav.rooms a{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 10px 7px 9px;border-left:2px solid transparent;border-radius:0 4px 4px 0;color:var(--ink);text-decoration:none;font:500 13.5px/1.3 var(--ui)}
nav.rooms a svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--mute)}
nav.rooms a small{color:var(--mute);font:500 11px/1 var(--ui);font-variant-numeric:tabular-nums}
nav.rooms a:hover{background:var(--page)} nav.rooms a:hover svg{color:var(--ink)}
nav.rooms a[aria-current="page"]{background:var(--page);border-left-color:var(--ink);font-weight:600} nav.rooms a[aria-current="page"] svg{color:var(--ink)}
nav.rooms a.title{font:700 14.5px/1.3 var(--ui);letter-spacing:.01em;padding-block:9px}
nav.rooms hr{border:0;border-top:1px solid var(--line);margin:6px 10px 6px 11px}
button.more-t{border:0;background:none;border-radius:0;cursor:pointer;padding:12px 11px 6px;font:600 10px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
button.more-t::after{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
button.more-t[aria-expanded="true"]::after{transform:rotate(45deg) translate(-2px,-2px)}
button.more-t:hover{color:var(--ink)}
.rooms-list{display:flex;flex-direction:column;gap:1px} .rooms-list[hidden]{display:none!important}
nav.rooms a:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
.room-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h2{font:700 20px/1.2 var(--ui);letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:600 16px/1.35 var(--ui);margin:0;text-wrap:balance}
h4{margin:0}
p{margin:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.sheet{background:var(--page);border:1px solid var(--line);border-radius:4px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.reading{font:400 16px/1.7 var(--read);max-width:68ch}
.reading blockquote{margin:0;padding:4px 0 4px 16px;border-left:2px solid var(--ink);font-style:italic}
.ref{align-self:flex-start;font:500 13px/1.3 var(--ui);color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor}
.passage{display:flex;flex-direction:column;gap:6px}
.passage .big{font:700 24px/1.2 var(--ui);letter-spacing:.02em}
ol.q,ul.q{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
dl.words{margin:0;display:flex;flex-direction:column;gap:10px} dl.words dt{font-weight:600} dl.words dd{margin:2px 0 0;color:var(--ink)}
.grade{display:inline-block;font:600 10px/1 var(--ui);letter-spacing:.1em;padding:3px 6px;border-radius:4px;background:transparent;border:1px solid var(--line);color:var(--mute);vertical-align:2px;margin-left:6px}
.grade.TEXT{background:var(--soft);border-color:var(--soft);color:var(--ink)} .grade.CONSENSUS{border-color:var(--pos);color:var(--pos)}
.grade.DISPUTED{border-color:var(--warn);color:var(--warn)} .grade.SUGGESTION{border-color:var(--mute);color:var(--mute)}
.practice{border-top:1px solid var(--line);padding-top:12px}
aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.rhythm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rhythm li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.rhythm li:last-child{border-bottom:0} .rhythm li.done span.t{color:var(--mute);text-decoration:line-through}
.rhythm .m{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:2px 0 0}
button{font:500 14px/1 var(--ui);border:1px solid var(--line);background:var(--page);color:var(--ink);padding:9px 14px;border-radius:4px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.link{border:0;background:none;padding:4px 0;color:var(--ink);text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
textarea,select,input[type=text]{font:15px/1.55 var(--read);width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 12px/1 var(--ui);padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:var(--page);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.entry .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.entry .body{font:400 15.5px/1.7 var(--read);white-space:pre-wrap;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--page);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .kind{font:500 12px/1.3 var(--ui);color:var(--mute)}
.card p{font:400 14.5px/1.6 var(--read)}
.card .caution{font-size:13px;color:var(--mute);font-style:italic}
.status{font:600 10.5px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.status.now{border-color:var(--ink);color:var(--ink)} .status.next{border-color:var(--pos);color:var(--pos)}
details.study{background:var(--page);border:1px solid var(--line);border-radius:4px}
details.study>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
details.study>summary::-webkit-details-marker{display:none}
details.study .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.sessions{list-style:none;margin:0;padding:0} .sessions li{display:grid;grid-template-columns:24px 28px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.sessions .n{font:600 12px/1.6 var(--ui);color:var(--mute);font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font:italic 400 15px/1.6 var(--read)}
.note{font-size:13px;color:var(--mute)}
.stream{display:flex;flex-direction:column;gap:12px}
.stream-h{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--ink);padding-left:12px}
.answer{font:400 15.5px/1.7 var(--read);white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pr{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.pr:first-of-type{border-top:0;padding-top:0}
.pr .who{font-weight:600} .pr .for{font:400 15px/1.55 var(--read)} .pr.done .who{text-decoration:line-through;color:var(--mute)}
.script{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:4px}
.script p{font:400 15px/1.6 var(--read)} .script b{font:600 11px/1 var(--ui);letter-spacing:.12em;margin-right:6px}
.script p.speaking{background:var(--soft);border-radius:4px;outline:4px solid var(--soft)}
/* Podcast player (design sweep, 15 Nov; Atlas's player is the model): title, hairline scrub, elapsed and remaining, one transport row, one quiet tool row of icons. */
.pod-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pod-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.pod-title b{font:700 16px/1.25 var(--ui);letter-spacing:.01em;overflow-wrap:anywhere}
.pod-title span{font:500 11px/1.3 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.pod-scrub{display:flex;flex-direction:column;gap:6px}
input.scrub{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer;--p:0%}
input.scrub::-webkit-slider-runnable-track{height:2px;background:linear-gradient(var(--ink),var(--ink)) 0/var(--p) 100% no-repeat,var(--line);border-radius:1px}
input.scrub::-moz-range-track{height:2px;background:var(--line);border-radius:1px} input.scrub::-moz-range-progress{height:2px;background:var(--ink)}
input.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:var(--ink);border:2px solid var(--page)}
input.scrub::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--page)}
input.scrub:disabled{cursor:default;opacity:.5}
.pod-times{display:flex;justify-content:space-between;font:500 11px/1 var(--ui);color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.pod-ctl{display:flex;gap:18px;align-items:center;justify-content:center}
.pod-tools{display:flex;gap:4px;align-items:center;justify-content:center;border-top:1px solid var(--line);padding-top:10px}
.cbtn{background:none;border:1px solid var(--line);color:var(--ink);width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.cbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cbtn .n{position:absolute;bottom:3px;font:600 8px/1 var(--ui);letter-spacing:.04em}
.cbtn.play{width:56px;height:56px;background:var(--ink);color:var(--page);border-color:var(--ink)}
.cbtn.play svg{fill:currentColor;stroke:none;width:22px;height:22px}
.cbtn.tool{border-color:transparent;border-radius:4px;width:40px;height:36px;color:var(--mute)} .cbtn.tool svg{width:18px;height:18px}
.cbtn.tool:hover,.cbtn.tool[aria-pressed="true"]{color:var(--ink);background:var(--soft)}
.cbtn.speed{font:600 11.5px/1 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cbtn:hover{background:var(--soft)} .cbtn.play:hover{background:var(--ink);opacity:.88}
.cbtn:disabled{opacity:.35;cursor:default}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal>.sheet{width:min(640px,100%);max-height:100%;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
/* Prayer in the rail (design sweep, 15 Nov): a hairline-ruled list under the rooms, round ticks that fill with ink, today's count on the right, a quiet add line, a chevron to the full list. */
.pw{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding:14px 0 0 11px}
.pw-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pw-h .eyebrow{font-size:10px;letter-spacing:.16em}
.pw-count{font:500 11px/1 var(--ui);color:var(--mute);font-variant-numeric:tabular-nums}
.pw-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pw-row{display:grid;grid-template-columns:18px minmax(0,1fr) 18px;align-items:center;gap:8px;padding:5px 0;min-width:0}
.pw-name{min-width:0;text-align:left;border:0;background:none;padding:0;font:500 13px/1.35 var(--ui);color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-chev{border:0;background:none;padding:0;width:18px;height:18px;display:grid;place-items:center;color:var(--mute);cursor:pointer;opacity:0;transition:opacity .15s}
.pw-chev svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.pw-row:hover .pw-chev,.pw-chev:focus-visible,.pw-chev[aria-expanded="true"]{opacity:1} .pw-chev[aria-expanded="true"] svg{transform:rotate(90deg)}
@media (hover:none){.pw-chev{opacity:1}}
.pw-detail{display:flex;flex-direction:column;gap:6px;padding:2px 0 10px 26px}
.pw-detail textarea{min-height:0;font:13px/1.45 var(--read);padding:6px 8px;background:var(--page)}
.pw-detail .link{align-self:flex-start;font-size:12px;padding:0}
input.tick{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin:0;border:1.5px solid var(--mute);border-radius:50%;display:grid;place-items:center;cursor:pointer;background:transparent;flex:none}
input.tick::after{content:'';width:4px;height:7px;border-right:1.5px solid var(--page);border-bottom:1.5px solid var(--page);transform:rotate(45deg) translate(-.5px,-1px);opacity:0}
input.tick:checked{background:var(--ink);border-color:var(--ink)} input.tick:checked::after{opacity:1}
input.tick:disabled{opacity:.4;cursor:default}
.pw-list li.done .pw-name{color:var(--mute)}
.pw-add{display:grid;grid-template-columns:18px minmax(0,1fr);align-items:center;gap:8px;color:var(--mute)}
.pw-add svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;justify-self:center}
.pw-add input[type=text]{font:13px/1.3 var(--ui);padding:5px 0;background:transparent;border:0;border-bottom:1px solid transparent;border-radius:0}
.pw-add input[type=text]:focus{border-bottom-color:var(--ink);outline:none}
.pw-add input[type=text]::placeholder{color:var(--mute)}
.pw-more{display:inline-flex;align-items:center;gap:6px;font:500 12px/1.3 var(--ui);color:var(--mute);text-decoration:none}
.pw-more svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pw-more:hover{color:var(--ink)}
/* State lamps (design sweep, 15 Nov): the same meanings as before (red writing or recording, amber requested, green new and unplayed), in muted tokens, a small lamp in a hairline ring, slow motion only. The label stays grey; the lamp carries the colour. */
.onair{display:inline-flex;align-items:center;gap:7px;font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.onair i{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.onair i::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--rec)}
.onair.red i::after{animation:breathe 2.6s ease-in-out infinite}
.onair.amber i::after{background:var(--amb);animation:pulse2 2.2s ease-in-out infinite}
.onair.green i::after{background:var(--pos)} .onair.green i{border-color:var(--pos)}
.onair.dot{gap:0} .onair.dot b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pulse2{0%,40%,100%{opacity:1}20%,60%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.onair i::after{animation:none!important}}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .fold-t{font-weight:600}
details.fold>summary .fold-t::before{content:'\25B8';display:inline-block;width:16px;color:var(--mute);transition:transform .15s}
details.fold[open]>summary .fold-t::before{transform:rotate(90deg)}
details.fold>summary .fold-n{font:500 12px/1 var(--ui);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.fold-in{display:flex;flex-direction:column;gap:10px;padding:10px 0 4px 16px;min-width:0}
details.fold.sheet{padding:10px 18px} details.fold.sheet>summary{border-bottom:0}
.fold-add{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.fold-add textarea{min-height:0}
.fold-in>button,.fold-in>.link{align-self:flex-start}
.gen{font:500 14.5px/1.9 var(--read)}
/* Segmented control (Timeline room, Library filters) */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;background:var(--page);padding:2px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;border-radius:3px;padding:7px 12px;font:600 12px/1 var(--ui);letter-spacing:.02em;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)} .seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.refs{display:flex;gap:6px;flex-wrap:wrap}
a.refchip{font:500 12px/1 var(--ui);color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:5px 8px;white-space:nowrap;font-variant-numeric:tabular-nums} a.refchip:hover{border-color:var(--ink)}
/* Podcast library (design sweep, 15 Nov): series as quiet sheets, each episode one row with its own play button; the page's single player plays it, so the Sabbath widget and the library stay in step. */
.lib-series{display:flex;flex-direction:column;gap:0}
.lib-series>.lib-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.lib-h h3{font:700 15px/1.3 var(--ui);letter-spacing:.01em} .lib-h span{white-space:nowrap;font:500 11px/1 var(--ui);color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.ep{border-bottom:1px solid var(--line)} .ep:last-child{border-bottom:0}

@media (max-width:560px){.lrow{grid-template-columns:minmax(0,1fr)}.spine::before{left:71px}.spine>li{grid-template-columns:58px 27px minmax(0,1fr)}}

<script>
/* MOCK ONLY: an in-memory stand-in for the artifact runtime, so the redesign can be seen without Kev's account. Not for publishing. */
(function () {
  var D = {"sabbath": [{"date": "2026-11-14", "study": "hebrews", "session": 1, "title": "God's final word: the better Son", "passage": {"ref": "Hebrews 1-3", "link": "https://www.esv.org/Hebrews+1-3/", "why": "You asked for an overview of Hebrews and to unpack chapters 1 to 3 together. Hebrews is a sermon to tired believers tempted to drift: Jesus is better, so hold fast. It holds the New Testament's fullest word on Sabbath rest (4:9), so it suits Saturdays."}, "readAloud": "Long ago, at many times and in many ways, God spoke to our fathers by the prophets, but in these last days he has spoken to us by his Son, whom he appointed the heir of all things, through whom also he created the world. He is the radiance of the glory of God and the exact imprint of his nature, and he upholds the universe by the word of his power. After making purification for sins, he sat down at the right hand of the Majesty on high. (Hebrews 1:1-3)", "readAloudNote": "ESV, checked this session.", "setting": "Hebrews calls itself 'my word of exhortation' (13:22): a sermon sent as a letter. The author is unknown. Paul, Barnabas (Tertullian's view), Apollos (Luther's view) and others have been proposed; Origen concluded only God knows (DISPUTED). It was most likely written in the AD 60s, before the temple fell in AD 70, to Jewish Christians who had suffered loss and prison (10:32-34) and were now tempted to drift back. The sermon alternates teaching about Christ with five warnings: 2:1-4, 3:7-4:13, 5:11-6:12, 10:26-39 and 12:25-29.", "sections": [{"heading": "The shape of the book", "body": "1:1-2:18 the Son is greater than the angels. 3:1-4:13 greater than Moses, and the rest that remains. 4:14-7:28 the great high priest in the order of Melchizedek. 8:1-10:18 a better covenant, sanctuary and sacrifice, once for all. 10:19-12:29 draw near, hold fast, run with endurance. 13 love, hospitality, marriage, money, leaders. The backbone is Psalm 110: the Son seated at God's right hand (110:1) and a priest forever (110:4).", "grade": "CONSENSUS"}, {"heading": "Chapter 1: seven claims, seven quotations", "body": "The Son is heir of all things, agent of creation, the radiance of God's glory, the exact imprint of his nature, the one who upholds the universe, who made purification for sins, and who sat down. Then seven Old Testament quotations place him above the angels: Psalm 2:7, 2 Samuel 7:14, Deuteronomy 32:43, Psalm 104:4, Psalm 45:6-7 ('Your throne, O God'), Psalm 102:25-27 and Psalm 110:1. The Deuteronomy line matches a Dead Sea Scroll copy found at Qumran (4QDeut-q), which ties to your Biblical Timeline.", "grade": "TEXT"}, {"heading": "He sat down", "body": "Old Testament priests stood daily, offering the same sacrifices that could never take away sins (10:11). Jesus sat down, because the work was finished (1:3; 10:12). That is the root of all rest in Hebrews.", "grade": "TEXT"}, {"heading": "Chapter 2: do not drift; we see Jesus", "body": "'We must pay much closer attention to what we have heard, lest we drift away from it' (2:1). Drift takes no effort, only neglect. Then Psalm 8: humanity was made to rule, but 'we do not yet see everything in subjection to him. But we see him... namely Jesus' (2:8-9). He shared our flesh and blood to destroy the devil and free those enslaved by the fear of death (2:14-15), and became a merciful and faithful high priest who helps the tempted (2:17-18).", "grade": "TEXT"}, {"heading": "Chapter 3: greater than Moses; today", "body": "Moses was faithful in God's house as a servant; Jesus is faithful over it as a son (3:5-6). Then Psalm 95: 'Today, if you hear his voice, do not harden your hearts.' The wilderness generation saw God's works for forty years and still did not trust him: 'they were unable to enter because of unbelief' (3:19). The cure is community: 'exhort one another every day, as long as it is called today' (3:13).", "grade": "TEXT"}, {"heading": "The warnings: three readings", "body": "Arminian and Wesleyan readers hold that real believers can finally fall away. Many Reformed readers hold the warnings address those who never truly believed. Others (Schreiner and Caneday) read them as one of the means God uses to keep his people. All agree: take them seriously and hold fast. Worth an hour with your pastor.", "grade": "DISPUTED"}], "observe": ["Hebrews 1:1-2: list each contrast between 'long ago' and 'these last days'.", "Count the seven claims about the Son in 1:2-3. Which one moves you most, and why?", "In 3:7-19, trace the words heart, today, rest and unbelief. What is the root problem?"], "words": [{"word": "exact imprint", "orig": "charakt\u0113r", "grade": "CONSENSUS (lexicon not checked this session)", "note": "The mark a seal or die leaves in wax or metal. Look at the Son and you see exactly what God is like."}, {"word": "founder", "orig": "arch\u0113gos", "grade": "CONSENSUS (lexicon not checked this session)", "note": "Pioneer or trailblazer: the one who goes first and leads others in (2:10; 12:2)."}, {"word": "propitiation", "orig": "hilaskomai", "grade": "CONSENSUS (lexicon not checked this session)", "note": "The sacrifice that turns away God's wrath against sin (2:17). The same family of words as Romans 3:25, in your reading spine."}], "crossRefs": [{"ref": "Psalm 110:1-4", "link": "https://www.esv.org/Psalm+110:1-4/", "note": "The backbone of the book: seated at the right hand, a priest forever."}, {"ref": "John 1:1-3", "link": "https://www.esv.org/John+1:1-3/", "note": "The Word through whom all things were made."}, {"ref": "Colossians 1:15-17", "link": "https://www.esv.org/Colossians+1:15-17/", "note": "The image of the invisible God, in whom all things hold together."}, {"ref": "Numbers 14:1-35", "link": "https://www.esv.org/Numbers+14:1-35/", "note": "The wilderness generation that would not enter: the story behind Hebrews 3."}, {"ref": "Romans 3:25", "link": "https://www.esv.org/Romans+3:25/", "note": "Propitiation in Romans, beside Hebrews 2:17."}], "reflect": ["Hebrews 1:3 says Jesus sat down because the work was finished. Where am I still standing, trying to finish what he finished?", "What is quietly crowding out the Word in my weeks right now (2:1)?", "Who exhorts me every day, and whom do I exhort (3:13)?"], "practice": {"name": "Consider Jesus", "how": "Read Hebrews 3:1, 'consider Jesus, the apostle and high priest of our confession.' For ten minutes, do only that: write one line for each of the seven claims in 1:2-3, and thank him for each. Then send one brother one line of encouragement today (3:13).", "stream": "The Word"}, "pray": "Adoration: the Son is the radiance of God's glory. Confession: where I have drifted or hardened my heart. Thanksgiving: he sat down; it is finished. Supplication: for one brother to exhort this week, and for a soft heart today.", "journalPrompts": ["What did I learn about God this week, from the reading or from life?", "Where did I see Jesus as better this week than the thing I was leaning on?", "What question did this passage raise that I want to bring to my pastor or Micah?"], "carry": "Hebrews 3:13", "carryLink": "https://www.esv.org/Hebrews+3:13/", "grades": "ESV quotations checked against the ESV text this session (14 Nov 2026). Word notes: common glosses, not yet checked in a lexicon. Background: CONSENSUS unless marked. Practice and questions: SUGGESTION.", "id": "2026-11-14"}, {"date": "2026-11-21", "study": "hebrews", "session": 2, "title": "The rest that remains and the priest who sympathizes", "passage": {"ref": "Hebrews 4:1-5:10", "link": "https://www.esv.org/Hebrews+4:1-5:10/", "why": "Chapter 3 ended with a generation that could not enter God's rest. Chapter 4 opens the door again, then introduces Jesus as the great high priest who understands us from the inside."}, "readAloud": "Since then we have a great high priest who has passed through the heavens, Jesus, the Son of God, let us hold fast our confession. For we do not have a high priest who is unable to sympathize with our weaknesses, but one who in every respect has been tempted as we are, yet without sin. Let us then with confidence draw near to the throne of grace, that we may receive mercy and find grace to help in time of need. (Hebrews 4:14-16)", "readAloudNote": "ESV, checked this session.", "setting": "The author keeps reading Psalm 95. If Joshua had given Israel final rest in Canaan, God would not have spoken centuries later through David of 'another day' (4:7-8). So the land was a picture. The rest is God's own seventh-day rest (Genesis 2:2), still open 'today' to all who believe.", "sections": [{"heading": "A Sabbath rest remains", "body": "'So then, there remains a Sabbath rest for the people of God, for whoever has entered God's rest has also rested from his works as God did from his' (4:9-10). It is entered by faith ('we who have believed enter that rest', 4:3) and yet we are to 'strive to enter that rest' (4:11). Rest is received, and it takes effort to keep receiving it.", "grade": "TEXT"}, {"heading": "The word that sees us", "body": "'The word of God is living and active, sharper than any two-edged sword... discerning the thoughts and intentions of the heart' (4:12). The same word that offers rest also exposes the hard heart. 'All are naked and exposed to the eyes of him to whom we must give account' (4:13). Then, at once, the high priest.", "grade": "TEXT"}, {"heading": "The great high priest", "body": "Jesus was 'in every respect... tempted as we are, yet without sin' (4:15). Every high priest is chosen from among men to deal gently with the ignorant and wayward (5:1-2). Jesus did not appoint himself; God did (Psalm 2:7 and 110:4 in 5:5-6). In Gethsemane he 'offered up prayers and supplications, with loud cries and tears' (5:7), and 'learned obedience through what he suffered' (5:8).", "grade": "TEXT"}, {"heading": "How does the Sabbath apply now?", "body": "Christians differ: Saturday rest kept as a command, Sunday as the Christian Sabbath, or a Sabbath principle without a fixed day, fulfilled in Christ (Romans 14:5-6; Colossians 2:16-17). Hebrews 4 agrees that the deepest rest is in Christ. Your family's Saturday conviction stands; this is worth an hour with your pastor.", "grade": "DISPUTED"}], "observe": ["How many times does 'rest' appear in 4:1-11? What is it each time: Canaan, God's seventh day, or something still ahead?", "Compare 4:12-13 with 4:14-16. Why might the author put exposure and mercy side by side?", "List what Jesus shares with every high priest (5:1-4) and what is unique to him (5:5-10)."], "words": [{"word": "Sabbath rest", "orig": "sabbatismos", "grade": "CONSENSUS (lexicon not checked this session)", "note": "A rare word, perhaps coined here: a Sabbath-keeping or Sabbath celebration. Not just a stop, but a feast of rest (4:9)."}, {"word": "sympathize", "orig": "sympathe\u014d", "grade": "CONSENSUS (lexicon not checked this session)", "note": "To suffer with, to feel with. Jesus does not observe our weakness from outside (4:15)."}, {"word": "with confidence", "orig": "parr\u0113sia", "grade": "CONSENSUS (lexicon not checked this session)", "note": "Boldness, freedom of speech: the right to speak openly before the throne (4:16; 10:19)."}], "crossRefs": [{"ref": "Genesis 2:2-3", "link": "https://www.esv.org/Genesis+2:2-3/", "note": "God rested on the seventh day: the rest Hebrews points to."}, {"ref": "Joshua 21:43-45", "link": "https://www.esv.org/Joshua+21:43-45/", "note": "Canaan's rest was real but not final."}, {"ref": "Matthew 11:28-30", "link": "https://www.esv.org/Matthew+11:28-30/", "note": "Come to me, and I will give you rest."}, {"ref": "Matthew 26:36-46", "link": "https://www.esv.org/Matthew+26:36-46/", "note": "Gethsemane: the loud cries and tears of Hebrews 5:7."}, {"ref": "Psalm 95:7-11", "link": "https://www.esv.org/Psalm+95:7-11/", "note": "The Psalm the whole section preaches."}], "reflect": ["Where am I striving to earn rest rather than striving to enter it?", "What weakness do I hide from God that Hebrews 4:15 says Jesus already understands?", "What would it look like this week to draw near 'with confidence' instead of with shame?"], "practice": {"name": "A Sabbath of receiving", "how": "Today, before any task, read 4:9-10 and 4:14-16 aloud. Name one work you are resting from and one weakness you are bringing to the throne of grace. Then do one thing purely for delight with your family.", "stream": "The Word"}, "pray": "Adoration: the high priest who passed through the heavens. Confession: the weaknesses I hide. Thanksgiving: mercy and grace to help in time of need. Supplication: for rest, at home and at Eden.", "journalPrompts": ["What did I learn about God this week, from the reading or from life?", "Where did I see Jesus as better this week than the thing I was leaning on?", "What question did this passage raise that I want to bring to my pastor or Micah?"], "carry": "Hebrews 4:16", "carryLink": "https://www.esv.org/Hebrews+4:16/", "grades": "ESV quotations checked against the ESV text this session (14 Nov 2026). Word notes: common glosses, not yet checked in a lexicon. Background: CONSENSUS unless marked. Practice and questions: SUGGESTION.", "id": "2026-11-21"}, {"date": "2026-11-28", "study": "hebrews", "session": 3, "title": "Grow up, hold the anchor, meet Melchizedek", "passage": {"ref": "Hebrews 5:11-7:28", "link": "https://www.esv.org/Hebrews+5:11-7:28/", "why": "The author pauses to rouse dull hearers (5:11-6:12), steadies them with God's oath (6:13-20), then opens the deep teaching he promised: Jesus a priest forever after the order of Melchizedek."}, "readAloud": "Consequently, he is able to save to the uttermost those who draw near to God through him, since he always lives to make intercession for them. (Hebrews 7:25)", "readAloudNote": "ESV, checked this session. A footnote offers 'forever' for 'to the uttermost'.", "setting": "Melchizedek appears twice in the Old Testament: as king of Salem and priest of God Most High who blessed Abraham and received a tenth (Genesis 14:18-20), and in Psalm 110:4, where the coming king is 'a priest forever after the order of Melchizedek'. Hebrews joins the two.", "sections": [{"heading": "Milk and solid food", "body": "'You have become dull of hearing... You need milk, not solid food' (5:11-12). Maturity is 'for those who have their powers of discernment trained by constant practice to distinguish good from evil' (5:14). Growth comes by practice, not just information.", "grade": "TEXT"}, {"heading": "The hardest warning (6:4-8)", "body": "'It is impossible, in the case of those who have once been enlightened... and then have fallen away, to restore them again to repentance' (6:4-6). Read it next to 6:9: 'in your case, beloved, we feel sure of better things.' The three readings from session 1 apply here most of all. Bring this passage to your pastor.", "grade": "DISPUTED"}, {"heading": "An anchor behind the curtain", "body": "God swore by himself to Abraham, so that 'by two unchangeable things, in which it is impossible for God to lie, we who have fled for refuge might have strong encouragement to hold fast to the hope set before us. We have this as a sure and steadfast anchor of the soul, a hope that enters into the inner place behind the curtain, where Jesus has gone as a forerunner on our behalf' (6:18-20).", "grade": "TEXT"}, {"heading": "Why Melchizedek matters", "body": "Abraham gave him a tenth and was blessed by him, so Melchizedek is greater than Levi, who was 'in the loins' of Abraham (7:4-10). Jesus is priest 'not on the basis of a legal requirement concerning bodily descent, but by the power of an indestructible life' (7:16). Levitical priests died and were replaced; 'he holds his priesthood permanently, because he continues forever' (7:24), and 'he always lives to make intercession' (7:25).", "grade": "TEXT"}, {"heading": "Who was Melchizedek?", "body": "Most read him as a real king-priest in Abraham's day, whose missing genealogy in Genesis makes him a type of Christ (7:3, 'resembling the Son of God'). Some early and modern readers think he was a pre-incarnate appearance of the Son. The text says 'resembling', which favours the first reading.", "grade": "DISPUTED"}], "observe": ["In 5:11-14, what marks the immature and what marks the mature?", "Read 6:4-6 and 6:9-12 together. How does the author speak to the same people in both?", "Make two columns from chapter 7: the Levitical priests and Jesus. What is 'better' about him?"], "words": [{"word": "dull", "orig": "n\u014dthros", "grade": "CONSENSUS (lexicon not checked this session)", "note": "Sluggish or lazy. The same word reappears in 6:12, 'that you may not be sluggish': the problem is a slow heart, not a slow mind."}, {"word": "forerunner", "orig": "prodromos", "grade": "CONSENSUS (lexicon not checked this session)", "note": "One who runs ahead to open the way, like a scout or the first boat to reach the harbour (6:20)."}, {"word": "to the uttermost", "orig": "eis to panteles", "grade": "CONSENSUS (lexicon not checked this session)", "note": "Completely and for all time: both senses sit in the phrase (7:25)."}], "crossRefs": [{"ref": "Genesis 14:18-20", "link": "https://www.esv.org/Genesis+14:18-20/", "note": "Melchizedek blesses Abram."}, {"ref": "Psalm 110:4", "link": "https://www.esv.org/Psalm+110:4/", "note": "A priest forever after the order of Melchizedek."}, {"ref": "Genesis 22:16-18", "link": "https://www.esv.org/Genesis+22:16-18/", "note": "God swears by himself to Abraham."}, {"ref": "1 Corinthians 3:1-3", "link": "https://www.esv.org/1+Corinthians+3:1-3/", "note": "Paul's milk and solid food."}, {"ref": "Romans 8:34", "link": "https://www.esv.org/Romans+8:34/", "note": "Christ Jesus who intercedes for us: your reading spine."}], "reflect": ["Where am I still on milk, knowing much but practising little?", "What storm in my life right now needs the anchor of 6:19?", "How does it change today's prayers to know Jesus 'always lives to make intercession' for me?"], "practice": {"name": "Train by practice", "how": "Pick one discernment you face this week, at home or at Eden. Before deciding, write the good, the evil and the merely convenient options, and pray 7:25 over it. That is 5:14's 'constant practice' in small form.", "stream": "The Word"}, "pray": "Adoration: a priest by the power of an indestructible life. Confession: sluggishness of heart. Thanksgiving: an anchor that holds. Supplication: for maturity, and for the people I lead.", "journalPrompts": ["What did I learn about God this week, from the reading or from life?", "Where did I see Jesus as better this week than the thing I was leaning on?", "What question did this passage raise that I want to bring to my pastor or Micah?"], "carry": "Hebrews 6:19", "carryLink": "https://www.esv.org/Hebrews+6:19/", "grades": "ESV quotations checked against the ESV text this session (14 Nov 2026). Word notes: common glosses, not yet checked in a lexicon. Background: CONSENSUS unless marked. Practice and questions: SUGGESTION.", "id": "2026-11-28"}, {"date": "2026-12-05", "study": "hebrews", "session": 4, "title": "A better covenant and a sacrifice once for all", "passage": {"ref": "Hebrews 8:1-10:18", "link": "https://www.esv.org/Hebrews+8:1-10:18/", "why": "The author says it plainly: 'Now the point in what we are saying is this: we have such a high priest' (8:1). These chapters are the summit of Hebrews: the new covenant, the true sanctuary, and the one sacrifice that finishes the work."}, "readAloud": "And every priest stands daily at his service, offering repeatedly the same sacrifices, which can never take away sins. But when Christ had offered for all time a single sacrifice for sins, he sat down at the right hand of God, waiting from that time until his enemies should be made a footstool for his feet. For by a single offering he has perfected for all time those who are being sanctified. (Hebrews 10:11-14)", "readAloudNote": "ESV, checked this session.", "setting": "The tabernacle Moses built was 'a copy and shadow of the heavenly things' (8:5). Once a year, on the Day of Atonement, the high priest entered the Most Holy Place with blood (Leviticus 16). Hebrews reads that whole system as a picture of Christ, who entered heaven itself with his own blood.", "sections": [{"heading": "The new covenant is here", "body": "Hebrews quotes Jeremiah 31:31-34 in full (8:8-12), the longest Old Testament quotation in the New. 'I will put my laws into their minds, and write them on their hearts' (8:10). 'In speaking of a new covenant, he makes the first one obsolete' (8:13).", "grade": "TEXT"}, {"heading": "Once for all", "body": "Christ 'entered once for all into the holy places... by means of his own blood, thus securing an eternal redemption' (9:12). His blood will 'purify our conscience from dead works to serve the living God' (9:14). 'He has appeared once for all at the end of the ages to put away sin by the sacrifice of himself' (9:26), and 'will appear a second time... to save those who are eagerly waiting for him' (9:28).", "grade": "TEXT"}, {"heading": "Shadow and substance", "body": "'The law has but a shadow of the good things to come' (10:1). 'It is impossible for the blood of bulls and goats to take away sins' (10:4). Psalm 40 shows the Son coming to do God's will (10:5-7), and 'by that will we have been sanctified through the offering of the body of Jesus Christ once for all' (10:10).", "grade": "TEXT"}, {"heading": "He sat down, again", "body": "The theme of session 1 returns: priests stand, Christ sat down (10:11-12). 'I will remember their sins and their lawless deeds no more' (10:17). 'Where there is forgiveness of these, there is no longer any offering for sin' (10:18). The work is finished.", "grade": "TEXT"}, {"heading": "Perfected and being sanctified", "body": "'By a single offering he has perfected for all time those who are being sanctified' (10:14). Two tenses in one verse: a finished standing before God, and an ongoing growth in holiness. Traditions describe how the two relate differently, but all hold both.", "grade": "CONSENSUS"}], "observe": ["Mark every 'once' and 'once for all' in 9:1-10:18. What does the repetition say?", "Compare what the old sacrifices could do (9:9-10; 10:1-4) with what Christ's sacrifice does (9:14; 10:10-14).", "Which promises of Jeremiah 31 (8:10-12) do you most need to hear this week?"], "words": [{"word": "mediator", "orig": "mesit\u0113s", "grade": "CONSENSUS (lexicon not checked this session)", "note": "A go-between who guarantees an agreement between two parties (8:6; 9:15; 12:24)."}, {"word": "once for all", "orig": "ephapax", "grade": "CONSENSUS (lexicon not checked this session)", "note": "Once, never to be repeated (7:27; 9:12; 10:10). The key word of these chapters."}, {"word": "conscience", "orig": "syneid\u0113sis", "grade": "CONSENSUS (lexicon not checked this session)", "note": "The inner witness that accuses or excuses. The old sacrifices could not perfect it (9:9); Christ's blood cleanses it (9:14; 10:22)."}], "crossRefs": [{"ref": "Jeremiah 31:31-34", "link": "https://www.esv.org/Jeremiah+31:31-34/", "note": "The new covenant promised."}, {"ref": "Leviticus 16", "link": "https://www.esv.org/Leviticus+16/", "note": "The Day of Atonement."}, {"ref": "Psalm 40:6-8", "link": "https://www.esv.org/Psalm+40:6-8/", "note": "'I have come to do your will'."}, {"ref": "Luke 22:20", "link": "https://www.esv.org/Luke+22:20/", "note": "The new covenant in my blood."}, {"ref": "Romans 8:1-4", "link": "https://www.esv.org/Romans+8:1-4/", "note": "No condemnation, in your reading spine."}], "reflect": ["What 'dead works' (9:14) is my conscience still trying to pay for?", "How does 'I will remember their sins no more' sit with how I remember my own?", "Where do I live as if the work were not finished?"], "practice": {"name": "Finished, so serve", "how": "Write down one thing you keep re-confessing or re-paying in your mind. Read 10:17-18 over it, then tear the paper up. Choose one act of service this week that comes from gratitude, not guilt (9:14).", "stream": "The Word"}, "pray": "Adoration: a high priest seated at the right hand. Confession: dead works I still lean on. Thanksgiving: sins remembered no more. Supplication: a clean conscience to serve the living God at home and at Eden.", "journalPrompts": ["What did I learn about God this week, from the reading or from life?", "Where did I see Jesus as better this week than the thing I was leaning on?", "What question did this passage raise that I want to bring to my pastor or Micah?"], "carry": "Hebrews 10:14", "carryLink": "https://www.esv.org/Hebrews+10:14/", "grades": "ESV quotations checked against the ESV text this session (14 Nov 2026). Word notes: common glosses, not yet checked in a lexicon. Background: CONSENSUS unless marked. Practice and questions: SUGGESTION.", "id": "2026-12-05"}], "studies": [{"id": "romans-5-8", "stream": "word", "title": "Romans 5 to 8: Life in the Spirit", "summary": "Four chapters from peace with God to no condemnation, the Spirit's life and the unbreakable love of God. It follows your reading spine and moves slowly where the gospel is richest.", "sessions": [{"n": 1, "title": "Peace with God", "read": "Romans 5:1-11", "focus": "Justification, peace, hope"}, {"n": 2, "title": "Adam and Christ", "read": "Romans 5:12-21", "focus": "Two heads, one gift"}, {"n": 3, "title": "Dead to sin, alive to God", "read": "Romans 6", "focus": "Union with Christ and baptism"}, {"n": 4, "title": "The struggle and the Spirit", "read": "Romans 7:7-8:17", "focus": "Law, flesh, Spirit, adoption"}, {"n": 5, "title": "Nothing can separate", "read": "Romans 8:18-39", "focus": "Groaning, glory, God's love"}], "resources": [{"title": "The Message of Romans", "author": "John Stott (IVP)", "link": "https://www.ivpress.com/"}, {"title": "Romans 1-7 For You and Romans 8-16 For You", "author": "Tim Keller (The Good Book Company)", "link": "https://www.thegoodbook.com/"}], "status": "next", "recommended": true}, {"id": "be-with-jesus", "stream": "practicing-the-way", "title": "Practicing the Way: Be With Jesus", "summary": "A slow study of the first movement of apprenticeship: being with Jesus through Scripture, prayer, Sabbath and stillness. Each session pairs a Gospel scene with one practice to try that week.", "sessions": [{"n": 1, "title": "Called to be with him", "read": "Mark 3:13-19", "focus": "The first thing Jesus does with the Twelve"}, {"n": 2, "title": "Come away and rest", "read": "Mark 6:30-32", "focus": "Rest in the middle of work"}, {"n": 3, "title": "Abide", "read": "John 15:1-11", "focus": "Remaining, not striving"}, {"n": 4, "title": "Alone with the Father", "read": "Mark 1:35; Luke 5:15-16", "focus": "Solitude and prayer"}, {"n": 5, "title": "A rule of life", "read": "Colossians 3:1-17", "focus": "What shape does my week take?"}], "resources": [{"title": "Practicing the Way", "author": "John Mark Comer (WaterBrook)", "link": "https://www.practicingtheway.org/"}], "status": "next", "recommended": true}, {"id": "bp-sabbath", "stream": "bibleproject", "title": "BibleProject: Sabbath and Rest across the Bible", "summary": "Follow rest from creation to the new creation using the book overviews and themes, reading the texts first. A good companion to your own Sabbath.", "sessions": [{"n": 1, "title": "God rests", "read": "Genesis 1:1-2:3", "focus": "Seventh day and creation"}, {"n": 2, "title": "Manna and the pattern", "read": "Exodus 16", "focus": "Trust in daily provision"}, {"n": 3, "title": "Remember the rescue", "read": "Exodus 20:8-11; Deuteronomy 5:12-15", "focus": "Two reasons for one command"}, {"n": 4, "title": "The Lord of the Sabbath", "read": "Mark 2:23-3:6", "focus": "What Jesus says rest is for"}, {"n": 5, "title": "A rest that remains", "read": "Hebrews 3:7-4:13", "focus": "The fulfilment"}], "resources": [{"title": "Themes and book overviews", "author": "BibleProject", "link": "https://bibleproject.com/"}], "status": "later"}, {"id": "willard-vim", "stream": "willard", "title": "Willard's VIM: Vision, Intention, Means", "summary": "Learn Willard's three-part pattern for real change, and test it against Scripture and your examen. Practice it on one pillar at a time.", "sessions": [{"n": 1, "title": "Vision: the life offered", "read": "John 10:10; Matthew 6:33", "focus": "What is the life worth wanting?"}, {"n": 2, "title": "Intention: decide", "read": "Romans 12:1-2", "focus": "Choosing to be changed"}, {"n": 3, "title": "Means: grace through practice", "read": "1 Timothy 4:7-8", "focus": "Training, not trying"}, {"n": 4, "title": "Renewing the mind and heart", "read": "Colossians 3:1-17", "focus": "Thoughts, feelings, will"}, {"n": 5, "title": "Grace and effort", "read": "Philippians 2:12-13", "focus": "Work out what God works in"}], "resources": [{"title": "Renovation of the Heart", "author": "Dallas Willard (NavPress)", "link": "https://www.navpress.com/"}, {"title": "Dallas Willard Ministries", "author": "Willard Ministries", "link": "https://dwillard.org/"}], "status": "later"}, {"id": "soul-keeping", "stream": "ortberg", "title": "Soul Keeping with John Ortberg", "summary": "A study of the care of the soul, drawing on Ortberg and Scripture. It pairs well with the weekly examen.", "sessions": [{"n": 1, "title": "What is the soul?", "read": "Mark 8:36-37", "focus": "Why the soul matters"}, {"n": 2, "title": "A soul at rest", "read": "Psalm 62:1-2; Psalm 131", "focus": "Quieting the soul"}, {"n": 3, "title": "Guarding the heart", "read": "Proverbs 4:23", "focus": "Attention and habit"}, {"n": 4, "title": "Soul and body", "read": "Psalm 139:13-16", "focus": "The whole person"}, {"n": 5, "title": "Soul friends", "read": "Proverbs 27:17; James 5:16", "focus": "Community and confession"}], "resources": [{"title": "Soul Keeping", "author": "John Ortberg (Zondervan)", "link": "https://www.zondervan.com/"}], "status": "later"}, {"id": "confessions", "stream": "church-history", "title": "Augustine's Confessions and the restless heart", "summary": "Read selected books of Augustine's prayer-memoir alongside Psalms. A classic of conversion, mother love and longing for God.", "sessions": [{"n": 1, "title": "Restless until it rests", "read": "Psalm 62:1; Confessions I", "focus": "The opening prayer"}, {"n": 2, "title": "The pear tree and sin", "read": "Psalm 51; Confessions II", "focus": "Sin understood"}, {"n": 3, "title": "The garden", "read": "Romans 13:11-14; Confessions VIII", "focus": "The turning"}, {"n": 4, "title": "Monica", "read": "Proverbs 31; Confessions IX", "focus": "A mother's prayers"}, {"n": 5, "title": "Time and memory", "read": "Psalm 90; Confessions X-XI", "focus": "Wonder at God"}], "resources": [{"title": "Confessions", "author": "Augustine (CCEL, public domain)", "link": "https://www.ccel.org/ccel/augustine/confess.html"}], "status": "later"}, {"id": "awakenings", "stream": "church-history", "title": "The Great Awakenings: Edwards, Whitefield, Wesley", "summary": "Read the 18th-century revivals through the people God used and the texts they preached. See what revival meant and what it cost.", "sessions": [{"n": 1, "title": "The preached word", "read": "Acts 2:14-41", "focus": "The model of awakening"}, {"n": 2, "title": "Edwards and the affections", "read": "Romans 5:1-5 and Psalm 42", "focus": "True religion of the heart"}, {"n": 3, "title": "Whitefield, the field preacher", "read": "John 3:1-21", "focus": "The new birth"}, {"n": 4, "title": "Wesley's warmed heart", "read": "Romans 8:14-17", "focus": "Assurance and the Spirit"}, {"n": 5, "title": "What revival leaves behind", "read": "1 Thessalonians 1:2-10", "focus": "Fruit that lasts"}], "resources": [{"title": "Christian History Institute: Great Awakenings", "author": "Christian History Institute", "link": "https://christianhistoryinstitute.org/"}], "status": "later"}, {"id": "desert-and-rule", "stream": "church-history", "title": "Desert Fathers and the Rule of Benedict", "summary": "A short study of stillness, work and prayer in the early monastic tradition, read beside Jesus' own withdrawing to pray. Take the rhythms, leave what Scripture does not require.", "sessions": [{"n": 1, "title": "Anthony goes to the desert", "read": "Matthew 4:1-11; Mark 1:35", "focus": "Withdrawal for God"}, {"n": 2, "title": "The sayings", "read": "Proverbs 10:19; James 3:1-12", "focus": "Words and silence"}, {"n": 3, "title": "Pray and work", "read": "Colossians 3:23", "focus": "Ora et labora"}, {"n": 4, "title": "Hours of prayer", "read": "Psalm 119:164; Daniel 6:10", "focus": "A rhythm of day"}, {"n": 5, "title": "Hospitality", "read": "Hebrews 13:1-2", "focus": "Welcome as worship"}], "resources": [{"title": "The Rule of Benedict", "author": "Benedict (CCEL)", "link": "https://www.ccel.org/ccel/benedict"}, {"title": "Life of Antony", "author": "Athanasius (CCEL)", "link": "https://www.ccel.org/"}], "status": "later"}, {"id": "hebrews", "order": -1, "status": "now", "stream": "word", "title": "Hebrews: Hold fast to the better Son", "summary": "Saturday studies with Barny through Hebrews. Jesus is better than the angels, Moses, the priests and the old covenant, so hold fast. Four sessions so far, through chapter 10; ask Barny for the rest.", "sessions": [{"n": 1, "title": "God's final word: the better Son", "read": "Hebrews 1-3", "focus": "Overview of the book; the Son, the drift warning, today"}, {"n": 2, "title": "The rest that remains", "read": "Hebrews 4:1-5:10", "focus": "Sabbath rest; the high priest who sympathizes"}, {"n": 3, "title": "Grow up, hold the anchor", "read": "Hebrews 5:11-7:28", "focus": "Maturity; the hardest warning; Melchizedek"}, {"n": 4, "title": "Once for all", "read": "Hebrews 8:1-10:18", "focus": "New covenant; the finished sacrifice"}], "resources": [{"title": "Hebrews (BibleProject overview video)", "author": "BibleProject", "link": "https://bibleproject.com/explore/video/hebrews/"}, {"title": "Read Hebrews in the ESV", "author": "esv.org", "link": "https://www.esv.org/Hebrews+1/"}]}], "people": [{"id": "augustine", "name": "Augustine of Hippo", "years": "354-430", "place": "Hippo, North Africa", "tradition": "Early church (Western)", "kind": "church father", "knownFor": "Bishop and theologian whose Confessions tell his restless search and conversion. His thought on sin and grace shaped Catholic and Protestant theology alike.", "practice": "Pray your story to God, as the Confessions do.", "read": {"title": "Confessions (CCEL)", "link": "https://www.ccel.org/ccel/augustine/confess.html"}, "grade": "CONSENSUS", "caution": "Protestants and Catholics read him differently on grace and the church; read as a witness, not a final authority."}, {"id": "monica", "name": "Monica", "years": "c. 331-387", "place": "North Africa and Ostia", "tradition": "Early church", "kind": "church mother", "knownFor": "Mother of Augustine, remembered for years of persevering prayer for her son. Our main source is Augustine's Confessions.", "practice": "Keep praying for one person over years without a deadline.", "read": {"title": "Confessions, Book IX (CCEL)", "link": "https://www.ccel.org/ccel/augustine/confess.html"}, "grade": "CONSENSUS (dates approximate)"}, {"id": "athanasius", "name": "Athanasius of Alexandria", "years": "c. 296-373", "place": "Alexandria, Egypt", "tradition": "Early church", "kind": "church father", "knownFor": "Defender of the full deity of Christ at and after Nicaea, often against the stream, and exiled several times. His On the Incarnation is a classic.", "practice": "Hold a first-order truth steadily when it is unpopular.", "read": {"title": "On the Incarnation (CCEL)", "link": "https://www.ccel.org/ccel/athanasius/incarnation.html"}, "grade": "CONSENSUS (birth year approximate)"}, {"id": "anthony", "name": "Anthony of Egypt", "years": "c. 251-356", "place": "Egyptian desert", "tradition": "Early monastic", "kind": "church father", "knownFor": "Early desert hermit whose life, told by Athanasius, drew many to solitude and prayer. Often called a father of monasticism.", "practice": "Take a short stretch of real solitude to pray.", "read": {"title": "Life of Antony (CCEL)", "link": "https://www.ccel.org/"}, "grade": "CONSENSUS (dates traditional)", "caution": "Later accounts add legend; treat details as tradition."}, {"id": "macrina", "name": "Macrina the Younger", "years": "c. 327-379", "place": "Cappadocia (modern Turkey)", "tradition": "Early church", "kind": "church mother", "knownFor": "Sister of Basil of Caesarea and Gregory of Nyssa; a teacher and ascetic who shaped her brothers, as told by Gregory in his Life of Macrina.", "practice": "Teach your own household by quiet example.", "read": {"title": "Life of Saint Macrina (Gregory of Nyssa)", "link": "https://www.ccel.org/"}, "grade": "CONSENSUS (dates approximate)"}, {"id": "benedict", "name": "Benedict of Nursia", "years": "c. 480-c. 547", "place": "Nursia and Monte Cassino, Italy", "tradition": "Western monasticism", "kind": "saint", "knownFor": "Wrote the Rule that shaped Western monastic life around prayer, work, study and hospitality.", "practice": "Order the day around prayer and work: a simple rule of life.", "read": {"title": "The Rule of Benedict (CCEL)", "link": "https://www.ccel.org/ccel/benedict"}, "grade": "CONSENSUS (dates approximate)", "caution": "A Catholic monastic rule; borrow the rhythm, test it against Scripture."}, {"id": "patrick", "name": "Patrick", "years": "5th century (traditionally c. 385-461)", "place": "Britain and Ireland", "tradition": "Early church (Celtic)", "kind": "saint", "knownFor": "A former slave who returned to Ireland as a missionary and wrote a brief Confession of his calling.", "practice": "Pray where you work, and make a habit of gratitude for rescue.", "read": {"title": "Saint Patrick (Britannica)", "link": "https://www.britannica.com/biography/Saint-Patrick"}, "grade": "CONSENSUS on the broad story; dates uncertain", "caution": "Many legends gather around him; only the Confession and a letter are firmly his."}, {"id": "francis", "name": "Francis of Assisi", "years": "1181/82-1226", "place": "Assisi, Italy", "tradition": "Medieval Catholic", "kind": "saint", "knownFor": "Gave up wealth to live in poverty and preach the gospel; founded the Franciscans; praised for love of creation.", "practice": "Practice simplicity: give something up to love Christ and neighbour freely.", "read": {"title": "Saint Francis of Assisi (Britannica)", "link": "https://www.britannica.com/biography/Saint-Francis-of-Assisi"}, "grade": "CONSENSUS", "caution": "Many popular stories are later and sentimental."}, {"id": "teresa", "name": "Teresa of Avila", "years": "1515-1582", "place": "Avila, Spain", "tradition": "Catholic mystic and reformer", "kind": "saint", "knownFor": "Carmelite reformer and writer on prayer, especially in The Interior Castle.", "practice": "Treat prayer as friendship, a plain talking with the one who loves you.", "read": {"title": "The Interior Castle (CCEL)", "link": "https://www.ccel.org/"}, "grade": "CONSENSUS", "caution": "Visions and mystical states are her own testimony; Protestants read her for devotion, not as a pattern for experience."}, {"id": "lawrence", "name": "Brother Lawrence", "years": "c. 1614-1691", "place": "Paris, France", "tradition": "Catholic (Carmelite lay brother)", "kind": "spiritual writer", "knownFor": "A kitchen worker whose conversations and letters, compiled as The Practice of the Presence of God, show prayer in ordinary work.", "practice": "Do ordinary tasks as if with God present.", "read": {"title": "The Practice of the Presence of God (CCEL)", "link": "https://www.ccel.org/ccel/lawrence/practice"}, "grade": "CONSENSUS (birth year approximate)"}, {"id": "luther", "name": "Martin Luther", "years": "1483-1546", "place": "Wittenberg, Germany", "tradition": "Reformer (Lutheran)", "kind": "reformer", "knownFor": "Augustinian monk who recovered the gospel of justification by faith alone and sparked the Reformation; translated the Bible into German.", "practice": "Write down what Scripture tells you about grace and pray it back.", "read": {"title": "Martin Luther (CCEL)", "link": "https://www.ccel.org/ccel/luther"}, "grade": "CONSENSUS", "caution": "His writings include harsh statements about Jews and others that must be named plainly and rejected."}, {"id": "calvin", "name": "John Calvin", "years": "1509-1564", "place": "Geneva, Switzerland", "tradition": "Reformer (Reformed)", "kind": "reformer", "knownFor": "Pastor and theologian of the Reformation; his Institutes shaped Reformed theology.", "practice": "Read Scripture in order and pray what you read.", "read": {"title": "Institutes of the Christian Religion (CCEL)", "link": "https://www.ccel.org/ccel/calvin/institutes"}, "grade": "CONSENSUS", "caution": "Reformed views on election are disputed with Arminians; talk with your pastor."}, {"id": "wesley", "name": "John Wesley", "years": "1703-1791", "place": "England", "tradition": "Anglican, founder of Methodism", "kind": "revival preacher", "knownFor": "Preacher and organiser of the Methodist revival, with an emphasis on assurance and holiness of heart and life.", "practice": "Meet with a small group to confess and encourage.", "read": {"title": "The Journal of John Wesley (CCEL)", "link": "https://www.ccel.org/ccel/wesley"}, "grade": "CONSENSUS", "caution": "Wesleyan views on perfection and free will differ from Reformed readings."}, {"id": "whitefield", "name": "George Whitefield", "years": "1714-1770", "place": "England and the American colonies", "tradition": "Anglican, Calvinist Methodist", "kind": "revival preacher", "knownFor": "Field preacher of the Great Awakening, whose preaching drew very large crowds on both sides of the Atlantic.", "practice": "Speak plainly of the new birth to someone this week.", "read": {"title": "George Whitefield (Britannica)", "link": "https://www.britannica.com/biography/George-Whitefield"}, "grade": "CONSENSUS", "caution": "Whitefield held slaves and defended slavery, which must be faced honestly."}, {"id": "edwards", "name": "Jonathan Edwards", "years": "1703-1758", "place": "Northampton, Massachusetts", "tradition": "Congregationalist (Reformed)", "kind": "revival preacher", "knownFor": "Pastor and theologian of the Great Awakening; wrote on the religious affections and true revival.", "practice": "Write resolutions and review them often.", "read": {"title": "Works of Jonathan Edwards (CCEL)", "link": "https://www.ccel.org/ccel/edwards"}, "grade": "CONSENSUS", "caution": "He is often reduced to one sermon on wrath; read his work on beauty and the affections too."}, {"id": "spurgeon", "name": "Charles Spurgeon", "years": "1834-1892", "place": "London, England", "tradition": "Reformed Baptist", "kind": "revival preacher", "knownFor": "Prince of preachers at the Metropolitan Tabernacle; wrote Morning and Evening and The Treasury of David.", "practice": "Read a Psalm slowly and speak it back to God.", "read": {"title": "Spurgeon sermons", "link": "https://www.spurgeon.org/"}, "grade": "CONSENSUS", "caution": "He suffered with depression; his honest struggle is itself instructive."}, {"id": "carmichael", "name": "Amy Carmichael", "years": "1867-1951", "place": "Dohnavur, India", "tradition": "Irish Protestant missionary", "kind": "spiritual writer", "knownFor": "Missionary who rescued children from temple service and wrote devotional books and poems.", "practice": "Offer daily work as a gift with no audience.", "read": {"title": "Amy Carmichael (Britannica)", "link": "https://www.britannica.com/biography/Amy-Carmichael"}, "grade": "CONSENSUS"}, {"id": "tenboom", "name": "Corrie ten Boom", "years": "1892-1983", "place": "Haarlem, Netherlands", "tradition": "Dutch Reformed", "kind": "spiritual writer", "knownFor": "Hid Jews in WWII, survived Ravensbruck, and spoke widely about forgiveness; author of The Hiding Place.", "practice": "Forgive by an act of the will, then ask for the feelings.", "read": {"title": "Corrie ten Boom (Britannica)", "link": "https://www.britannica.com/biography/Corrie-ten-Boom"}, "grade": "CONSENSUS"}, {"id": "bonhoeffer", "name": "Dietrich Bonhoeffer", "years": "1906-1945", "place": "Berlin, Germany", "tradition": "Lutheran", "kind": "spiritual writer", "knownFor": "Pastor and theologian who opposed the Nazi regime and was executed; wrote The Cost of Discipleship and Life Together.", "practice": "Confess sin to a trusted brother, as in Life Together.", "read": {"title": "Dietrich Bonhoeffer (Britannica)", "link": "https://www.britannica.com/biography/Dietrich-Bonhoeffer"}, "grade": "CONSENSUS", "caution": "His later prison thoughts on religionless Christianity are debated; start with Life Together."}, {"id": "tozer", "name": "A. W. Tozer", "years": "1897-1963", "place": "Chicago, USA", "tradition": "Christian and Missionary Alliance", "kind": "spiritual writer", "knownFor": "Pastor and author of The Pursuit of God and The Knowledge of the Holy, on hunger for God.", "practice": "Pray slowly through one attribute of God.", "read": {"title": "The Pursuit of God (CCEL)", "link": "https://www.ccel.org/ccel/tozer"}, "grade": "CONSENSUS"}], "next": [{"id": "next-romans-5-8", "title": "Romans 5 to 8: Life in the Spirit", "why": "It follows the spine you are already reading and takes the gospel's richest chapters slowly.", "stream": "word"}, {"id": "next-be-with-jesus", "title": "Practicing the Way: Be With Jesus", "why": "It turns Sabbath, Scripture and prayer into one rhythm, and it is the frame you named.", "stream": "practicing-the-way"}, {"id": "next-bp-sabbath", "title": "BibleProject: Sabbath and Rest", "why": "It deepens the very day you are keeping, from Genesis to Hebrews.", "stream": "bibleproject"}, {"id": "next-willard-vim", "title": "Willard's VIM for one pillar", "why": "It gives a clear method for sanctification you can test on a single pillar.", "stream": "willard"}, {"id": "next-confessions", "title": "Augustine's Confessions", "why": "One of the great prayers of the church, with Monica's story in it.", "stream": "church-history"}, {"id": "next-awakenings", "title": "The Great Awakenings", "why": "It shows what revival looked like and where your own hunger sits in a long line.", "stream": "church-history"}], "podcasts": [{"id": "rest-is-not-a-reward", "title": "Rest Is Not a Reward", "stream": "practicing-the-way", "premise": "The Guide and the Kid ask why anyone stops working on purpose. They follow rest from the seventh day to Romans 5:1 and Hebrews 4, and land on a gift, not a prize.", "segments": ["Cold open: a farmer who cannot sit still on his day off", "Why God rested, and why Israel was told to remember the rescue", "Wait, but: is rest laziness, or trust?", "Try this: one thing to enjoy, not fix, on the next Sabbath"], "length": "about 20 min", "status": "idea"}, {"id": "the-man-who-stayed-in-the-desert", "title": "The Man Who Stayed in the Desert", "stream": "church-history", "premise": "The story of Anthony of Egypt, who left the city for solitude, and what ordinary people can borrow from it without moving to a cave. Facts from Athanasius' Life of Antony are checked before any script.", "segments": ["Cold open: a young man hears a Gospel reading and gives everything away", "Why stillness mattered to the early church", "Wait, but: is the desert escape or training?", "Try this: ten minutes of quiet with one verse"], "length": "about 20 min", "status": "idea"}, {"id": "be-with-become-like-do-as", "title": "Be With, Become Like, Do As", "stream": "practicing-the-way", "premise": "How Jesus trained twelve ordinary men, and how an apprentice follows him today. The idea is Comer's frame in paraphrase, tested against Mark 3:14 and John 15.", "segments": ["Cold open: a trade apprentice learning beside the master", "Mark 3:14: appointed to be with him, then sent", "Wait, but: is this just self-improvement?", "Try this: one small practice for the week"], "length": "about 20 min", "status": "idea"}], "charts": [], "framework": {"intro": "A Sabbath in the workshop is unhurried and has four movements: read the Word, study it with a pen, journal what the week taught you, and look ahead to what to study next. Nothing here is homework; take what the day gives and leave the rest, because the Sabbath was made for man (Mark 2:27). Barny prepares the page by Friday before sunset and sits with you only when you open it.", "rhythm": [{"step": "Settle", "minutes": 5, "what": "Phone down, a short prayer, and the verse you carried in from last Sabbath."}, {"step": "Read the Word aloud", "minutes": 10, "what": "The Sabbath passage, slowly, in the ESV. Read it twice."}, {"step": "Study with a pen", "minutes": 20, "what": "Observe, interpret, apply: the questions, word notes and cross-references on the page."}, {"step": "Journal", "minutes": 15, "what": "Log what you learned this week and what the passage asked of you. These are your entries, stored for you alone."}, {"step": "Study a stream", "minutes": 15, "what": "One reading from the current study, a person from the people list, or a chart we have built."}, {"step": "Pray", "minutes": 5, "what": "Adoration, confession, thanksgiving, supplication, in your words."}, {"step": "Look ahead", "minutes": 10, "what": "Choose next Sabbath's passage or study from the next list. Carry one verse into the week."}], "totalMinutes": 80, "streams": [{"id": "word", "name": "The Word (book by book)", "what": "Slow, whole-book reading and study in the ESV, moving from observation to interpretation to application. Today this is your Romans spine, with one Sabbath passage studied more deeply.", "why": "It is the authority over every other stream and it keeps them honest.", "grade": "TEXT, then SUGGESTION for method", "starter": {"title": "ESV reading plans and text", "author": "Crossway", "link": "https://www.esv.org/"}, "doctrineNote": "Everything else on this page is read against the Word."}, {"id": "practicing-the-way", "name": "Practicing the Way (John Mark Comer)", "what": "A guide to apprenticeship to Jesus: the frame, in paraphrase, is be with Jesus, become like him, do as he did, carried by practices such as Sabbath, Scripture, prayer, fasting and simplicity.", "why": "It turns what you already do on the Sabbath, the Word and prayer, into one connected way of life, and it speaks to pace and hurry.", "grade": "CONSENSUS on the frame; DISPUTED on some emphases", "starter": {"title": "Practicing the Way: Be with Jesus. Become like him. Do what he did.", "author": "John Mark Comer", "link": "https://www.practicingtheway.org/"}, "doctrineNote": "Comer is an evangelical pastor who draws on monastic and contemplative practice (silence, solitude, rule of life). Faithful Christians differ on how far to borrow from those traditions. Read generously, test each practice against Scripture, and take questions to your pastor or Micah."}, {"id": "bibleproject", "name": "BibleProject", "what": "Free videos, podcasts and classes on the Bible as one unified story, by theme and by book, with a strong eye for literary design and Hebrew background.", "why": "The charts and maps we have built sit well beside their book overviews, and the themes show how Old and New Testaments connect.", "grade": "CONSENSUS on the main storyline; DISPUTED on some interpretive claims", "starter": {"title": "Book overviews and Themes library", "author": "BibleProject", "link": "https://bibleproject.com/"}, "doctrineNote": "BibleProject is non-denominational and teaches from scholarly work. On contested questions (for example creation, the divine council, how sacrifice works) they often present one view well, not all views. Treat it as a B source: check against the text and the doctrine map."}, {"id": "willard", "name": "Dallas Willard", "what": "A philosopher and teacher on spiritual formation: the kingdom of God as life available now, the disciplines as means of grace, and the VIM pattern of change (Vision, Intention, Means).", "why": "He gives a clear method for sanctification that fits your examen and the Seven Pillars, with plain effort and no striving for acceptance.", "grade": "CONSENSUS on the disciplines as means; DISPUTED on some emphases", "starter": {"title": "Renovation of the Heart", "author": "Dallas Willard (NavPress)", "link": "https://www.navpress.com/"}, "doctrineNote": "Willard was a Southern Baptist. Some Reformed readers feel he gives less weight to the cross and to the doctrine of imputed righteousness than they would; others find him a corrective to a gospel of mere forgiveness. Read with Romans open. Also see The Divine Conspiracy and The Spirit of the Disciplines; official resources at dwillard.org.", "extra": [{"title": "The Divine Conspiracy", "author": "Dallas Willard (HarperOne)", "link": "https://www.harpercollins.com/"}, {"title": "The Spirit of the Disciplines", "author": "Dallas Willard (HarperOne)", "link": "https://www.harpercollins.com/"}, {"title": "Dallas Willard Ministries", "author": "Willard Ministries", "link": "https://dwillard.org/"}]}, {"id": "ortberg", "name": "John Ortberg", "what": "Warm, practical teaching on spiritual growth, shaped by Willard: ordinary life as the place of formation, and the care of the soul.", "why": "He is a gentle on-ramp to Willard's ideas, with stories and questions that work in a journal.", "grade": "CONSENSUS on the goal; SUGGESTION on method", "starter": {"title": "The Life You've Always Wanted", "author": "John Ortberg (Zondervan)", "link": "https://www.zondervan.com/"}, "doctrineNote": "Evangelical and mainstream, with the same Willard-shaped emphasis on training, not trying. Also Soul Keeping, on the care of the soul.", "extra": [{"title": "Soul Keeping", "author": "John Ortberg (Zondervan)", "link": "https://www.zondervan.com/"}]}, {"id": "church-history", "name": "Church history: fathers, mothers, saints and revivals", "what": "The lives and writings of those who walked with God before us: the early church, the desert, the Reformation, the awakenings and the missionaries.", "why": "A cloud of witnesses (Hebrews 12:1) steadies a young faith and a busy one, and it shows how the same gospel has been lived across centuries.", "grade": "CONSENSUS on the facts; DISPUTED on veneration and some theology", "starter": {"title": "Christian Classics Ethereal Library (primary texts)", "author": "Calvin University", "link": "https://www.ccel.org/"}, "doctrineNote": "Protestants honour the saints as examples and teachers (Hebrews 13:7). Catholic and Orthodox churches also ask saints to pray for the living and speak of patron saints, which most Protestants do not practise. That is a second-order matter on the doctrine map. Read these people for their devotion and learn from their practices with discernment; none is a doctrinal authority on his or her own."}]}, "tl": {"events": {"about": "The right-hand column of the Finds map: biblical people and events from Genesis 1 to Revelation 22, in traditional order. Dates are approximate and follow the traditional reading; where scholars differ, the note says so. Seeded 24 October 2026 by Barnabas.", "events": [{"id": "creation", "title": "Creation", "refs": ["Genesis 1:1-2:25"], "when": "Before history", "note": "Archaeology cannot test creation. Babylonian creation stories exist, but they are parallels, not confirmation."}, {"id": "flood", "title": "The Flood", "refs": ["Genesis 6:5-9:17"], "when": "Before history", "note": "Several Mesopotamian flood stories survive. No dig has physically confirmed a global flood; the links here are parallels."}, {"id": "babel", "title": "Babel and the nations", "refs": ["Genesis 10:1-11:32"], "when": "Early Bronze Age setting", "note": "The setting is real: Mesopotamian cities with stepped temple towers (ziggurats), and Ur as a great city. The event itself is untested."}, {"id": "patriarchs", "title": "Abraham, Isaac and Jacob", "refs": ["Genesis 12:1-36:43"], "when": "c. 2000-1700 BC (traditional)", "note": "No find names Abraham, Isaac or Jacob. Finds show the world Genesis describes was real: Haran, Nahor, and herders moving between Mesopotamia and Canaan."}, {"id": "egypt", "title": "Joseph and Israel in Egypt", "refs": ["Genesis 37:1-50:26", "Exodus 1:1-22"], "when": "c. 1900-1500 BC (traditional)", "note": "No find names Joseph. Semitic people settled in the Nile Delta and served in Egyptian households in this period, which matches the setting."}, {"id": "exodus", "title": "Exodus and the wilderness", "refs": ["Exodus 1:11", "Exodus 12:1-14:31", "Numbers 22:1-24:25"], "when": "15th or 13th century BC (both views held)", "note": "Nothing in Egypt directly records the Exodus. Scholars split between an early date (c. 1446 BC, from 1 Kings 6:1) and a late date (c. 1260 BC, from the city name Raamses)."}, {"id": "conquest", "title": "Conquest and the judges", "refs": ["Joshua 6:1-27", "Joshua 11:10-13", "Judges 1:1-21:25"], "when": "c. 1400-1050 BC", "note": "By about 1208 BC Egypt knew Israel as a people in Canaan. The destruction layers at Jericho and Hazor are real; their dates and attribution are debated."}, {"id": "david", "title": "Saul, David and Solomon", "refs": ["1 Samuel 17:1-58", "2 Samuel 5:6-10", "1 Kings 9:15", "1 Kings 14:25-26"], "when": "c. 1050-930 BC", "note": "Once doubted as legend, David is named as the founder of a royal house about 150 years after his death. How large his kingdom was is still argued."}, {"id": "divided", "title": "Divided kingdom: Omri, Ahab and Jehu", "refs": ["1 Kings 16:23-28", "1 Kings 22:39", "2 Kings 3:4-27", "2 Kings 9:1-10:36", "2 Kings 14:23-29"], "when": "c. 930-750 BC", "note": "From here the kings of Israel appear in their enemies' records by name, and the outside evidence gets dense."}, {"id": "samaria", "title": "Assyria and the fall of Samaria", "refs": ["2 Kings 15:19-20", "2 Kings 15:29", "2 Kings 17:1-6", "Isaiah 20:1"], "
