<style>
/* Layout: a quiet study room. A slim rail of rooms on the left (tabs on a phone), one reading column in the middle, a margin column for the rhythm and notes. */
:root{

  --ui:'Montserrat','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--page:#1D1D1C;--ink:#F2F0EA;--mute:#A3A09A;--line:#2F2F2D;--soft:#232321;--accent:#F2F0EA;--accent-ink:#111111;--pos:#7DB391;--warn:#D2A95C;color-scheme:dark}}

*{box-sizing:border-box}

.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px}

a.home{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--ui);color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--page);border-radius:4px;padding:9px 14px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

.sub{color:var(--mute);font-size:13px}

.room-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

.passage .big{font:700 24px/1.2 var(--ui);letter-spacing:.02em}

.note{font-size:13px;color:var(--mute)}
.stream{display:flex;flex-direction:column;gap:12px}

.pod-ctl{display:flex;gap:12px;align-items:center;justify-content:center}

.cbtn:hover{background:var(--soft)} .cbtn.play:hover{background:var(--ink);opacity:.9}
.pod-time{text-align:center;font:500 12px/1 var(--ui);color:var(--mute);font-variant-numeric:tabular-nums}
.pod-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;cursor:pointer} .pod-bar i{display:block;height:100%;width:0;background:var(--ink)}

.pw{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.pw-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pw-list li{border-bottom:1px solid var(--line)} .pw-list li:last-child{border-bottom:0}
.pw-row{display:flex;align-items:center;gap:8px;padding:4px 0;min-width:0}
.pw-name{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font:400 13px/1.35 var(--ui);color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-name[aria-expanded="true"]{font-weight:600}
.pw-detail{display:flex;flex-direction:column;gap:4px;padding:0 0 8px 22px}

.pw-detail .link{align-self:flex-start;font-size:12px;padding:0}

@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 6px 1px rgba(233,162,59,.7)}50%{opacity:.25;box-shadow:none}}

@keyframes onair{0%{box-shadow:0 0 0 0 rgba(229,72,59,.55);opacity:1}70%{box-shadow:0 0 0 8px rgba(229,72,59,0);opacity:.75}100%{box-shadow:0 0 0 0 rgba(229,72,59,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.onair i{animation:none!important}}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .fold-t{font-weight:600}

.fold-add textarea{min-height:0}
.fold-in>button,.fold-in>.link{align-self:flex-start}
.gen{font:500 14.5px/1.9 var(--read)}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}

}

</style>

<div class="wrap">

</div>

<script>
