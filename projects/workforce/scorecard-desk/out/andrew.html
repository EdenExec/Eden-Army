  var ok=!miss.length&&canWrite;
  if(s&&!s.edited){stampEl.appendChild(h('p',{class:'note',text:'Done. The Round Table picks this up within the hour. Changed something? Re-enter your initials below to finish again.'}))}
  var inp=h('input',{type:'text',id:'f-init',maxlength:'3',autocomplete:'off',autocapitalize:'characters',placeholder:PERSON.init,'aria-describedby':'init-help'});
  var b=h('button',{type:'button',class:'stampbtn',text:s?'Finish the week again':'Finish the week'});b.disabled=true;
  inp.oninput=function(){initDraft=inp.value;b.disabled=!(ok&&initOk(inp.value));if(!b.disabled)b.classList.add('lit');else b.classList.remove('lit')};
  b.onclick=function(){doStamp(inp.value)};
  inp.value=initDraft;b.disabled=!(ok&&initOk(initDraft));if(!b.disabled)b.classList.add('lit');
  stampEl.appendChild(h('label',{class:'f','for':'f-init'},h('span',null,'1. Your initials',h('small',{id:'init-help',text:ok?'Type your initials, then press Finish the week.':'Type your initials now; Finish the week lights up once the tabs listed below are done.'})),inp));
  stampEl.appendChild(h('div',{class:'f'},h('span',{class:'stamp-step',text:'2. Send it in'}),b));
  if(miss.length)stampEl.appendChild(h('p',{class:'note miss',text:'Still to finish: '+miss.join(', ')+'.'}))}
function updScore(){if(!scoreEl)return;var n=boxCount(),pct=Math.round(n/BOXES*100);scoreEl.innerHTML='';scoreEl.appendChild(h('span',null,h('b',{text:String(n)}),' / '+BOXES+' boxes'));scoreEl.appendChild(h('span',null,h('b',{text:pct+'%'}),' from your boxes'));scoreEl.appendChild(h('span',{class:'chip '+(pct>=90?'ok':'warn'),text:pct>=90?'Win':'Under 90%'}));if(A.stamp)scoreEl.appendChild(h('span',{class:'score-seal',title:'Stamped by '+A.stamp.init},seal('sm'),h('span',{class:'vh',text:'Stamped '+A.stamp.init})))}
function pageFinal(){scoreEl=h('div',{class:'score'});updScore();stampEl=h('div',{class:'stampbox'});updStamp();
  return h('section',null,h('h2',{text:'Your score and next week'}),scoreEl,
    fld('a','self_score','Your score for the week (%)','Your honest read. A win is 90% or better.',true,'num'),
    fld('a','align','How aligned was this week with your 10-5-3-1?','',true,{min:1,max:5,lo:'off track',hi:'fully aligned'}),
    fld('a','autopsy','Autopsy: one thing you’d do differently','If you hit 15 RPs every day, write “hit my numbers”.',true),
    fld('a','next_week','Next week I will: three commitments','These are your action items. We check them first next Friday.',true),
    fld('a','wip','FTIs, PTCs and pending starts that need a follow-up','',false),
    fld('a','jos','JOs you want to work next week (and any that are dead)','Leadership confirms in the review.',false),stampEl)}
function pageCandor(){return h('section',null,h('h2',{text:'Candor'}),h('p',{class:'note',text:'Only Kev reads this page. Skip anything you’d rather say in person.'}),
  fld('c','burnout','Burn-out','A workload read only.',false,{min:1,max:10,lo:'fried',hi:'fresh'}),
  fld('c','need','What do you need from leadership to win next week?','',false),
  fld('c','resolve','Anything you’d like resolved, or something we should be talking about?','',false))}
var BUILD=[pageWins,pageValues,pageMust,pageDaily,pageNumbers,pageCandor,pageFinal];
function done(i){if(i===0)return !!(A.wins&&A.grew);if(i===1)return A.cv.some(Boolean)&&!!A.lived_out;if(i===2)return A.wr.every(function(x){return x!=null});if(i===3)return A.d.some(Boolean);if(i===4)return false;if(i===6)return A.self_score!=null&&!!A.align&&!!A.autopsy&&!!A.next_week;if(i===5)return C.burnout!=null;return true}
function renderNav(){var n=$('nav');n.innerHTML='';PAGES.forEach(function(p,i){var b=h('button',{type:'button','aria-current':String(i===cur)},(i+1)+' '+p,(i===6&&A.stamp)?h('span',{class:'dot stampdot','aria-label':'stamped'}):done(i)?h('span',{class:'dot','aria-label':'done'}):null);b.onclick=function(){go(i)};n.appendChild(b)});updHeadStamp();updStamp()}
function go(i){cur=i;stampEl=null;scoreEl=null;try{localStorage.setItem('sc-tab-'+PERSON.slug,(meta&&meta.weekOf||'')+'|'+i)}catch(e){}renderNav();var c=$('pages');c.innerHTML='';c.appendChild(BUILD[i]());
  var f=h('div',{class:'foot'});if(i>0){var b=h('button',{type:'button',class:'ghost',text:'Back'});b.onclick=function(){go(i-1)};f.appendChild(b)}else f.appendChild(h('span'));
  if(i<PAGES.length-1){var nx=h('button',{type:'button',text:'Next: '+PAGES[i+1]});nx.onclick=function(){go(i+1);window.scrollTo(0,0)};f.appendChild(nx)}else f.appendChild(h('span',{class:'note',text:'That’s it. Everything saves as you go.'}));
  c.appendChild(f)}

function start(){A.cv=arr(A.cv,21);A.w=arr(A.w,8);A.wr=(A.wr&&A.wr.length===8)?A.wr:[null,null,null,null,null,null,null,null];A.d=arr(A.d,35);var t=0;try{var v=(localStorage.getItem('sc-tab-'+PERSON.slug)||'').split('|');if(v[0]===meta.weekOf){var n=Number(v[1]);if(n>=0&&n<PAGES.length)t=n}}catch(e){}go(t)}
(async function(){
  status('Connecting…');
  var to=setTimeout(function(){banner('Could not reach the scorecard store. Refresh the page; if it keeps happening, tell Kev.')},10000);
  var dbx=null,user=null;
  try{dbx=await claude.use('db');user=await claude.use('user')}catch(e){}
  if(!dbx){clearTimeout(to);banner('Sign in to Claude with your Eden account to fill this in.');$('wk').textContent='';return}
  db=dbx;
  try{uid=user?await user.id():null}catch(e){}
  try{
    var m=await db.doc('meta/week').get();meta=m&&m.exists!==false?(m.data?m.data():m):null;
  }catch(e){}
  clearTimeout(to);
  if(!meta||!meta.weekOf){banner('This week’s scorecard isn’t open yet.');$('wk').textContent='';return}
  $('wk').textContent='Week of '+meta.weekLabel+(meta.window?' · numbers '+meta.window:'');
  var lockAt=Date.parse(meta.lockAt||'');locked=isFinite(lockAt)&&Date.now()>=lockAt;
  try{var p=await db.doc('prefill/'+meta.weekOf).get();pre=p&&p.exists!==false?(p.data?p.data():p):null}catch(e){}
  try{var a=await db.doc('weeks/'+meta.weekOf).get();A=JSON.parse(JSON.stringify(a&&a.exists!==false?(a.data?a.data():a)||{}:{}))}catch(e){A={}}
  if(uid){try{var c=await db.doc('candor/'+uid).get();var cd=c&&c.exists!==false?(c.data?c.data():c):null;CD=JSON.parse(JSON.stringify(cd||{}));C=CD[meta.weekOf]||{}}catch(e){C={}}}
  if(!uid)canWrite=false;
  status(locked?'Closed':'');
  if(locked)banner('Closed at '+ptTime(lockAt)+'. Kev has your answers.',true);
  else if(isFinite(lockAt))banner('Open from 8:00 PT (9:00 MT); the Power Hour is 10:00 PT (11:00 MT). About 15 minutes; it saves as you go. Finish early and you\u2019re first in line for your leadership meeting. Open until '+ptTime(lockAt)+'.',true);
  start();
})();
})();
