<title>Friday Pipeline Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap");
:root{
  --bg:#F6F3EB; --card:#FFFFFF; --soft:#F1EDE2; --fg:#111111; --muted:#6A6760; --line:#DAD5C8;
  --bar:#111111; --bar2:#A7A398; --ghost:#E4DFD2;
  --good:#3D6B4F; --bad:#8A3A32; --warn:#7A5A1C;
  --good-bg:#E4ECE6; --bad-bg:#F0E2DF; --warn-bg:#F1E8D4;
  --focus:#111111;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0C; --card:#151515; --soft:#1C1C1B; --fg:#ECE9E1; --muted:#9A968D; --line:#2C2B29;
    --bar:#ECE9E1; --bar2:#6B6861; --ghost:#262522;
    --good:#7FAE90; --bad:#CC7B71; --warn:#C9A25C;
    --good-bg:#1B2A21; --bad-bg:#2D1B19; --warn-bg:#2B2316;
    --focus:#ECE9E1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --card:#151515; --soft:#1C1C1B; --fg:#ECE9E1; --muted:#9A968D; --line:#2C2B29;
  --bar:#ECE9E1; --bar2:#6B6861; --ghost:#262522;
  --good:#7FAE90; --bad:#CC7B71; --warn:#C9A25C;
  --good-bg:#1B2A21; --bad-bg:#2D1B19; --warn-bg:#2B2316;
  --focus:#ECE9E1; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 18px;overflow-x:hidden}
*{min-width:0}
.num,td,th,.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto 10px}
.brand{font-weight:700;letter-spacing:.22em;font-size:12px}
.doc{font-weight:700;font-style:italic;font-size:15px}
.sub{color:var(--muted);font-size:11px}
.index{max-width:1200px;margin:0 auto 10px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.index button{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:500;color:var(--muted)}
.index button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.deckwrap{max-width:1200px;margin:0 auto;position:relative}
.track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;scroll-behavior:auto}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:2px 3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;height:calc(100dvh - 215px);min-height:520px;max-height:860px;display:flex;flex-direction:column}
.card-h{padding:16px 20px 8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kick{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{margin:2px 0 0;font-size:20px;line-height:1.2;font-weight:700}
.card-b{padding:6px 20px 14px;overflow-y:auto;flex:1 1 auto}
.card-f{padding:8px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:10px;color:var(--muted);flex-wrap:wrap}
.note{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:11px;font-weight:600}
.note:hover{background:var(--soft)}
.nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding:0}
.nav:disabled{opacity:.3;cursor:default}
.pos{max-width:1200px;margin:10px auto 0;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}
.foot{max-width:1200px;margin:10px auto 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:600}
/* generic bits */
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.big{font-size:34px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--soft)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-top:6px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:10px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-bg);border-color:var(--good)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn)}
.chip.pend{color:var(--muted);border-style:dashed}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:4px 8px 4px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12px}
td.r,th.r{text-align:right}
.t{height:6px;background:var(--ghost);border-radius:3px;position:relative}
.t i{display:block;height:100%;background:var(--bar);border-radius:3px}
.t i.part{background:transparent;border:1px solid var(--bar);height:100%}
svg{max-width:100%;height:auto;display:block}
svg text{font-family:inherit;fill:var(--fg)}
svg .m{fill:var(--muted)}
.cover{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.cover h1{font-size:clamp(28px,5vw,46px);margin:6px 0 4px;font-weight:700;line-height:1.1}
/* funnel */
.fun td,.fun th{padding-right:10px}
.fun .st{font-weight:600;white-space:nowrap}
.fun .cell{min-width:64px}
.fun .cell .v{font-weight:600;font-size:13px}
.fun .leak td{background:var(--bad-bg)}
.fun .na{color:var(--muted);font-weight:400}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0 8px}.stg{text-align:center;min-width:64px}.stg .l,.rt .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:3px}.arr{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.rt{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--soft)}.rt.leak{background:var(--bad-bg);border-color:var(--bad)}
.conv{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* team board */
.trow{display:grid;grid-template-columns:90px 1fr 84px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.trk{position:relative;height:14px;background:var(--ghost);border-radius:2px}
.trk .f{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:2px}
.trk .f.lo{background:var(--bar2)}
.trk .tick{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1px dashed var(--muted)}
/* org / depth */
.rootbox{display:inline-block;border:1.5px solid var(--fg);border-radius:4px;padding:8px 14px;max-width:100%}
.rootbox b{display:block;font-size:14px}
.stem{width:1px;height:14px;background:var(--line);margin-left:24px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:0}
.lane::before{content:"";display:block;width:1px;height:14px;background:var(--line);margin:0 0 6px 24px}
.lane h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.pc{display:flex;justify-content:space-between;gap:6px;align-items:baseline;border:1px solid var(--fg);border-radius:4px;padding:3px 7px;margin-bottom:4px;font-size:11px;line-height:1.3}
.pc b{font-weight:600;overflow-wrap:anywhere}.pc i{font-style:normal;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pc.stale{border-style:dashed;border-color:var(--bar2);color:var(--muted)}
.more{font-size:10px;color:var(--muted);padding:2px 0}
.empty{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.pill{border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:11px;margin:0 4px 4px 0;display:inline-block}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.q{border-bottom:1px solid var(--line);padding:10px 0}
.q b{font-weight:600}
.dec{display:grid;grid-template-columns:78px 1fr;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}
.legend td{font-size:12px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
.blk h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;font-weight:700}
@media (max-width:640px){
  .card{height:calc(100dvh - 190px);min-height:480px}
  .card-h,.card-b,.card-f{padding-left:14px;padding-right:14px}
  h2{font-size:17px}
  .trow{grid-template-columns:70px 1fr 70px}
  .dec{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<div class="top">
  <div><div class="brand">EDEN PARTNER GROUP</div><div class="doc">Friday Pipeline Review</div></div>
  <div class="sub" id="stamp"></div>
</div>
<nav class="index" id="index" aria-label="Sections"></nav>
<div class="deckwrap">
  <div class="track" id="track" tabindex="0" aria-label="Pipeline review cards. Use arrow keys to move between cards."></div>
</div>
<div class="pos"><button class="nav" id="prev" aria-label="Previous card">&#8592;</button><span id="pos"></span><button class="nav" id="next" aria-label="Next card">&#8594;</button></div>
<div class="foot"><span>edenpartnergroup.com</span><span>EDEN PARTNER GROUP</span></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
var M = D.meta || {};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function nv(v){return (v===null||v===undefined||v==="")?"–":v;}
function num(v){return typeof v==="number"?v:0;}
function fmt(v){return typeof v==="number"?v.toLocaleString("en-US"):nv(v);}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0;}
var PARTIAL_TAG = "partial week";
var cards = [], sections = [];

function add(id, sec, kick, title, body, src, opts){
  cards.push({id:id, sec:sec, kick:kick, title:title, body:body, src:src||"", cls:(opts&&opts.cls)||""});
}
function secStart(key,label){sections.push({key:key,label:label,first:cards.length});}

/* ---------- 1 cover ---------- */
secStart("cover","Cover");
(function(){
  var f=D.flow||{}, wk=(f.weeks||[]), p=wk.filter(function(w){return w.partial;})[0]||{v:{}}, J=D.jos||{}, I=D.intv||{};
  var tm=D.team||{};
  var b='<div class="cover"><div class="kick">'+esc(M.round_table||"")+'</div>'+
    '<h1>Friday Pipeline Review<br><span style="font-weight:500">'+esc(M.date)+'</span></h1>'+
    '<div class="muted" style="margin-bottom:6px">Data pulled '+esc(M.pulled)+'. JO board as of '+esc(M.board_asof)+'.</div>'+
    '<div><span class="chip warn">'+esc(M.partial_label)+'</span></div>'+
    '<div class="stats" style="margin-top:22px">'+
    stat(num(tm.total)+' <span class="muted" style="font-size:16px">/ '+num(tm.goal)+'</span>','RPs this week so far')+
    stat(fmt(tm.dials),'Dials so far')+stat('<span class="bad">'+nv((p.v||{}).resumes)+'</span> <span class="muted" style="font-size:16px">resumes</span>','So far this week')+
    stat(nv(J.total),'Active JOs')+
    stat(nv(I.people),'Interviewing now')+
    '</div><div class="muted" style="font-size:12px">Swipe, use the arrow keys, or pick a section above. Add a note on any card for Nick.</div></div>';
  add("cover","cover","Round Table","Cover",b,"Crelate API v3 read-only via Dean and Casey",{cls:"nohead"});
})();
function stat(v,l){return '<div class="stat"><div class="big num">'+v+'</div><div class="l">'+esc(l)+'</div></div>';}

/* ---------- 2 RPA flow ---------- */
secStart("flow","RPA flow");
(function(){
  var f=D.flow||{}, W=f.weeks||[], S=f.stages||[], RT=f.ratios||[], lk=f.leak||{};
  var P=W.filter(function(w){return w.partial;})[0]||{v:{},ratio:{}};
  var LEAKK="rr";
  var strip='<div class="strip">'+S.map(function(s,i){
    var v=(P.v||{})[s.k];
    return '<div class="stg"><div class="num big" style="font-size:24px">'+(v==null?"n/a":fmt(v))+'</div><div class="l">'+esc(s.n)+'</div></div>'+
      (i<S.length-1?'<div class="arr" aria-hidden="true">→</div>':'');
  }).join("")+'</div>';
  var tiles=RT.map(function(r){
    var v=(P.ratio||{})[r.k], av=(f.avg_ratio||{})[r.k], leak=r.k===LEAKK;
    return '<div class="rt'+(leak?' leak':'')+'"><div class="big num '+(leak?'bad':'')+'">'+(v==null?"n/a":v)+'</div><div class="l">'+esc(r.n)+'</div><div class="muted num" style="font-size:10px;margin-top:3px">'+(av==null?"no 4-wk figure":"4-wk "+av)+'</div></div>';
  }).join("");
  var head='<tr><th>Stage</th>'+W.map(function(w){return '<th>'+esc(w.label)+(w.partial?'*':'')+'</th>';}).join("")+'</tr>';
  var rows=S.map(function(s){
    var vals=W.map(function(w){return (w.v||{})[s.k];});
    var mx=Math.max.apply(null,vals.map(function(v){return num(v);}).concat([1]));
    return '<tr><td style="font-weight:600">'+esc(s.n)+'</td>'+W.map(function(w,i){var v=vals[i],isN=(v==null);
      return '<td style="min-width:62px"><div class="num '+(isN?'muted':'')+'" style="font-weight:600">'+(isN?"n/a":fmt(v))+(w.partial&&!isN?"*":"")+'</div>'+(isN?'':'<div class="t"><i class="'+(w.partial?'part':'')+'" style="width:'+pct(num(v),mx)+'%"></i></div>')+'</td>';}).join("")+'</tr>';
  }).join("");
  var rrows=RT.map(function(r){
    return '<tr><td class="muted">'+esc(r.n)+'</td>'+W.map(function(w){var v=(w.ratio||{})[r.k];return '<td class="num '+(v==null?'muted':'')+'">'+(v==null?"n/a":v)+'</td>';}).join("")+'</tr>';
  }).join("");
  var wr=lk.worst;
  var head2='Resumes are the leak: <span class="bad num">'+nv(lk.resumes_first)+'</span> a week on '+esc(lk.first_label||"")+', <span class="bad num">'+nv(lk.resumes_last)+'</span> on '+esc(lk.last_label||"")+', <span class="bad num">'+nv(lk.resumes_this)+'</span> so far this week.';
  var b=strip+'<div style="font-size:15px;font-weight:600;line-height:1.3;margin:6px 0 10px">'+head2+
    (wr?' And dials barely turn into RPs: '+esc(wr.name)+' made <span class="num">'+fmt(wr.dials)+'</span> dials for <span class="num">'+wr.rps+'</span> RPs.':'')+'</div>'+
    '<div class="tiles">'+tiles+'</div>'+
    '<div class="sec">Dial, RP, Resume, PTC, FTI by week</div><div class="tw"><table style="min-width:420px">'+head+rows+'<tr><th colspan="'+(W.length+1)+'" style="padding-top:10px">Ratios, per 100 of the step before</th></tr>'+rrows+'</table></div>'+
    '<div class="muted" style="font-size:10px;margin-top:6px">* '+esc(M.partial_label)+'. Five headhunters; Nick and Kev sit below the line. Dials are CloudTalk outbound calls for this week only ('+esc(f.dial_pulled||"")+'); earlier weeks have no dial data. Submittals, screens, offers and placements are not part of the flow.</div>';
  add("rpa-flow","flow","RPA flow in the business today","Dial, RP, Resume, PTC, FTI",b,"Dean (Crelate) and Radar (CloudTalk dials), "+PARTIAL_TAG);
})();

/* ---------- 3 team board ---------- */
secStart("team","Team");
(function(){
  var R=D.recs||[], T=D.team||{}, per=T.per||75, day=T.day||15, pace=day*4;
  function row(r){
    var v=r.vals||{}, rp=num(v.rps), lo=rp<pace;
    function c(x){return '<td class="r num">'+(x==null?'<span class="muted">n/a</span>':fmt(x))+'</td>';}
    return '<tr><td style="font-weight:600">'+esc(r.name)+'</td>'+c(v.dials)+
      '<td style="min-width:110px"><div class="num"><b class="'+(lo?'bad':'')+'">'+nv(v.rps)+'</b> <span class="muted">/ '+per+'</span></div><div class="trk" style="height:8px"><div class="f '+(lo?'lo':'')+'" style="width:'+pct(rp,per)+'%"></div><div class="tick" style="left:'+pct(pace,per)+'%"></div></div></td>'+
      c(v.resumes)+c(v.ptcs)+c(v.ftis)+'</tr>';
  }
  var hd='<tr><th>Recruiter</th><th class="r">Dial</th><th>RP (goal 75)</th><th class="r">Resume</th><th class="r">PTC</th><th class="r">FTI</th></tr>';
  var b='<div class="stats"><div class="stat"><div class="big num">'+nv(T.total)+' <span class="muted" style="font-size:16px">/ '+nv(T.goal)+'</span></div><div class="l">RPs, five headhunters, Mon to Thu</div></div>'+
    '<div class="stat"><div class="big num">'+fmt(T.dials)+'</div><div class="l">Dials, Mon to Thu</div></div></div>'+
    '<div class="tw"><table style="min-width:520px">'+hd+R.filter(function(r){return !r.below;}).map(row).join("")+
    '<tr><th colspan="6" style="padding-top:10px">Below the line</th></tr>'+R.filter(function(r){return r.below;}).map(row).join("")+'</table></div>'+
    '<div class="muted" style="font-size:10px;margin-top:8px">Dashed tick = Thursday pace ('+pace+' RPs). Dial n/a: no CloudTalk dials for Nick and Kev. Last full week: '+nv(T.last_total)+' RPs. Friday is still open.</div>';
  add("team-board","team","Team board","Dial, RP, Resume, PTC, FTI by recruiter",b,"Dean (Crelate) and Radar (CloudTalk), "+PARTIAL_TAG);
})();

/* ---------- 4 recruiters ---------- */
secStart("people","Recruiters");
(function(){
  var T=D.team||{}, day=T.day||15;
  (D.recs||[]).forEach(function(r){
    var days=r.days||[], any=days.some(function(d){return d.rps!=null;});
    var mx=Math.max.apply(null,days.map(function(d){return num(d.rps);}).concat([day+4]));
    var bw=44, x0=10, base=96, svg='<svg viewBox="0 0 250 120" role="img" aria-label="RPs by day against '+day+'">';
    days.forEach(function(d,i){
      var x=x0+i*(bw+4), v=d.rps, h=num(v)/mx*80;
      if(d.open&&v==null){
        svg+='<rect x="'+x+'" y="'+(base-18)+'" width="'+bw+'" height="18" fill="none" stroke="var(--bar2)" stroke-dasharray="3 3"/><text x="'+(x+bw/2)+'" y="'+(base-6)+'" font-size="8" text-anchor="middle" class="m">open</text>';
      } else if(v==null){
        svg+='<text x="'+(x+bw/2)+'" y="'+(base-4)+'" font-size="10" text-anchor="middle" class="m">0</text>';
      } else {
        svg+='<rect x="'+x+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" fill="'+(v>=day?'var(--good)':'var(--bad)')+'"/>';
        svg+='<text x="'+(x+bw/2)+'" y="'+(base-h-4)+'" font-size="10" text-anchor="middle" class="n" style="font-weight:600">'+v+'</text>';
      }
      svg+='<text x="'+(x+bw/2)+'" y="'+(base+14)+'" font-size="9" text-anchor="middle" class="m">'+esc(d.d)+'</text>';
    });
    var gy=base-day/mx*80;
    svg+='<line x1="0" x2="250" y1="'+gy+'" y2="'+gy+'" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="248" y="'+(gy-3)+'" font-size="8" text-anchor="end" class="m">goal '+day+'</text></svg>';
    var mt=(r.metrics||[]).map(function(m){
      var side=m.k==="mps";

  var b2='<div class="muted" style="margin-bottom:6px">Nothing is posted or scheduled until Kev says yes. Mon to Thu only, no Friday posts.</div>'+ps;
  add("rotation","marketing","Marketing","Next week’s posts for approval",b2,"Jenny, rotation.json, "+esc(R.week));

  var mv=(Li.moves||[]).map(function(r){return '<tr><td class="num">'+esc(r[0])+'</td><td style="white-space:normal;min-width:200px">'+esc(r[1])+'</td><td style="white-space:normal;min-width:120px">'+esc(r[2])+'</td></tr>';}).join("");
  var nm=(Li.numbers||[]).map(function(r){return '<tr><td style="white-space:normal"><b>'+esc(r[0])+'</b><div class="muted" style="font-size:10px">'+esc(r[1])+'</div></td><td style="white-space:normal">'+esc(r[2])+'</td></tr>';}).join("");
  var b3='<div class="cols"><div><div class="sec">Weekly exports, '+esc(Li.when)+'</div>'+ul([
      "Recruiter usage CSV: InMails sent, accepted, declined, rate per seat, plus credit balance and expiry",
      "Page analytics: visitors, followers and updates, last 7 days",

    '<div class="muted" style="font-size:10px;margin-top:6px">No LinkedIn connector, so a person exports. Menu names unverified until someone clicks through once.</div></div>'+
    '<div><div class="sec">Three numbers to watch</div><div class="tw"><table><tr><th>Number</th><th>Baseline</th></tr>'+nm+'</table></div></div></div>'+
    '<div class="sec">Five page moves</div><div class="tw"><table style="min-width:420px"><tr><th>#</th><th>Move</th><th>Owner</th></tr>'+mv+'</table></div>';
  add("linkedin","marketing","Marketing","LinkedIn reporting and page plan",b3,"Jenny, linkedin-reports.md and page-plan.md");
})();

secStart("agents","Agent WIP");
(function(){
  function blk(t,a){return '<div class="blk"><h3>'+t+'</h3>'+(a&&a.length?'<ul class="list">'+a.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>':'<span class="empty">nothing logged</span>')+'</div>';}
  (D.agents||[]).forEach(function(a){
    var b='<div class="muted" style="margin-bottom:6px">'+esc(a.role)+'</div><div class="cols">'+blk("Shipped",a.shipped)+blk("In progress",a.progress)+blk("Ideas for Kev (yes or no)",a.ideas)+blk("Where I can help",a.help)+'</div>';

  });
  var T=D.together||{}, N=T.nodes||[];
  var pos={jenny:[280,150],dean:[80,50],casey:[480,50],scout:[80,250],radar:[480,250]};
  var svg='<svg viewBox="0 0 560 300" role="img" aria-label="Jenny leads; Dean, Casey and Scout collaborate; Radar weighs in and publishes">';
  ["dean","casey","scout"].forEach(function(k){svg+='<line x1="280" y1="150" x2="'+pos[k][0]+'" y2="'+pos[k][1]+'" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>';});
  svg+='<line x1="280" y1="150" x2="480" y2="250" stroke="var(--muted)" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round"/>';
  svg+='<line x1="80" y1="250" x2="80" y2="50" stroke="var(--muted)" stroke-width="1" stroke-dasharray="1 7" stroke-linecap="round" opacity=".6"/>';
  N.forEach(function(nd){var p=pos[nd.id]||[0,0], lead=nd.id==="jenny";
    svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(lead?40:32)+'" fill="var(--card)" stroke="var(--fg)" stroke-width="'+(lead?2.5:1)+'"/><text x="'+p[0]+'" y="'+(p[1]+4)+'" font-size="'+(lead?14:12)+'" font-weight="700" text-anchor="middle">'+esc(nd.name)+'</text>';
    if(lead)svg+='<text x="280" y="212" font-size="9" text-anchor="middle" class="m">lead</text>';
  });
  svg+='</svg>';
  var leg=N.map(function(nd){return '<tr><td><b>'+esc(nd.name)+'</b></td><td>'+esc(nd.piece)+'</td></tr>';}).join("");
  var b='<div class="cols"><div>'+svg+'<div class="muted" style="font-size:10px">Dotted line = working together on one ticket. Lighter dots = weighs in. Dean to Scout: sheets-to-calls numbers for the scorecard.</div></div><div><div class="sec">Ticket: '+esc(T.ticket)+'</div><div class="tw"><table class="legend">'+leg+'</table></div>'+
    '<div class="muted" style="font-size:11px;margin-top:10px">First example of agents on one deliverable. Each agent returns its piece as a file; Jenny designs; Radar checks and publishes. Nothing is sent or shared without Kev.</div></div></div>';
  add("wip-working-together","agents","Agent WIP","Working together",b,"Per Q’s collaboration spec, 12 Nov");
})();

/* ---------- assemble ---------- */
var track=document.getElementById("track"), idx=document.getElementById("index"), prevB=document.getElementById("prev"), nextB=document.getElementById("next"), posEl=document.getElementById("pos");
document.getElementById("stamp").textContent="Pulled "+M.pulled+" · "+M.partial_label;
var noteBtns=[];
cards.forEach(function(c,i){
  var s=document.createElement("div"); s.className="slide"; s.setAttribute("role","group"); s.setAttribute("aria-label",c.title+" ("+(i+1)+" of "+cards.length+")");
  var a=document.createElement("article"); a.className="card"; a.id=c.id; a.setAttribute("data-i",i);
  a.innerHTML='<div class="card-h"><div><div class="kick">'+esc(c.kick)+'</div><h2>'+esc(c.title)+'</h2></div></div><div class="card-b">'+c.body+'</div><div class="card-f"><span>'+esc(c.src)+'</span><button class="note" type="button" hidden>Add a note</button></div>';
  s.appendChild(a); track.appendChild(s);
  var nb=a.querySelector(".note"); noteBtns.push(nb);
  nb.addEventListener("click",function(){ if(window.__comments){ try{ window.__comments.openComposer({element:a}); }catch(e){} } });
});
sections.forEach(function(s,i){
  var b=document.createElement("button"); b.type="button"; b.textContent=s.label; b.setAttribute("data-s",i);
  b.addEventListener("click",function(){go(s.first);}); idx.appendChild(b);
});
var cur=0, reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function secOf(i){var k=0;sections.forEach(function(s,j){if(i>=s.first)k=j;});return k;}
function mark(i){
  cur=i; prevB.disabled=i<=0; nextB.disabled=i>=cards.length-1;
  posEl.textContent="Card "+(i+1)+" of "+cards.length;
  var k=secOf(i); Array.prototype.forEach.call(idx.children,function(b,j){ if(j===k){b.setAttribute("aria-current","true"); try{b.scrollIntoView({inline:"nearest",block:"nearest"});}catch(e){}} else b.removeAttribute("aria-current"); });
  try{ history.replaceState(null,"","#"+cards[i].id); }catch(e){}
}
function go(i,instant){
  i=Math.max(0,Math.min(cards.length-1,i));
  track.scrollTo({left:i*track.clientWidth,behavior:(instant||reduce)?"auto":"smooth"}); mark(i);
}
var tick=false;
track.addEventListener("scroll",function(){
  if(tick)return; tick=true;
  requestAnimationFrame(function(){tick=false; var i=Math.round(track.scrollLeft/Math.max(1,track.clientWidth)); if(i!==cur&&i>=0&&i<cards.length)mark(i);});
},{passive:true});
prevB.addEventListener("click",function(){go(cur-1);});
nextB.addEventListener("click",function(){go(cur+1);});
document.addEventListener("keydown",function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  var t=e.target&&e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
  if(e.key==="ArrowRight"){e.preventDefault();go(cur+1);} else if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1);}
});
window.addEventListener("resize",function(){track.scrollTo({left:cur*track.clientWidth,behavior:"auto"});});
function fromHash(){
  var h=(location.hash||"").replace(/^#/,""), i=-1;
  cards.forEach(function(c,j){if(c.id===h)i=j;});
  return i;
}
window.addEventListener("hashchange",function(){var i=fromHash(); if(i>=0&&i!==cur)go(i);});
var start=fromHash(); go(start>=0?start:0,true);
/* JO filters */
var fil=document.getElementById("jofil");
if(fil){fil.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return; var f=b.getAttribute("data-f");
  Array.prototype.forEach.call(fil.children,function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
  Array.prototype.forEach.call(document.querySelectorAll("#jotbl tr[data-r]"),function(tr){
    var show=f==="all"||(f==="r"&&tr.dataset.r==="1")||(f==="n"&&tr.dataset.n==="1")||(f==="l"&&tr.dataset.l==="1");
    tr.hidden=!show;
  });
});}
/* comments capability: composer only, the shell shows threads */
(async function(){
  var c=null;
  try{ if(window.claude&&typeof window.claude.use==="function"){ c=await window.claude.use("comments"); } }catch(e){ c=null; }
  if(c&&typeof c.openComposer==="function"){ window.__comments=c; noteBtns.forEach(function(b){b.hidden=false;}); }
})();
})();
</script>
