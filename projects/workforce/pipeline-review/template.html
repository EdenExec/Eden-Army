<meta charset="utf-8">
<title>Friday Pipeline Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap");
:root{
  --bg:#F6F3EB; --card:#FFFFFF; --soft:#F1EDE2; --fg:#111111; --muted:#6A6760; --line:#DAD5C8;
  --bar:#111111; --bar2:#A7A398; --ghost:#E4DFD2;
  --good:#3D6B4F; --bad:#8A3A32; --warn:#7A5A1C;
  --good-bg:#E4ECE6; --bad-bg:#F0E2DF; --warn-bg:#F1E8D4;
  --focus:#111111;
  --scrim:rgba(17,17,17,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0C; --card:#151515; --soft:#1C1C1B; --fg:#ECE9E1; --muted:#9A968D; --line:#2C2B29;
    --bar:#ECE9E1; --bar2:#6B6861; --ghost:#262522;
    --good:#7FAE90; --bad:#CC7B71; --warn:#C9A25C;
    --good-bg:#1B2A21; --bad-bg:#2D1B19; --warn-bg:#2B2316;
    --focus:#ECE9E1; color-scheme:dark;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --card:#151515; --soft:#1C1C1B; --fg:#ECE9E1; --muted:#9A968D; --line:#2C2B29;
  --bar:#ECE9E1; --bar2:#6B6861; --ghost:#262522;
  --good:#7FAE90; --bad:#CC7B71; --warn:#C9A25C;
  --good-bg:#1B2A21; --bad-bg:#2D1B19; --warn-bg:#2B2316;
  --focus:#ECE9E1; color-scheme:dark;
  --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 18px;overflow-x:hidden}
*{min-width:0}
.num,td,th,.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.brand{font-weight:700;letter-spacing:.22em;font-size:12px}
.doc{font-weight:700;font-style:italic;font-size:15px}
.sub{color:var(--muted);font-size:11px}
.index{max-width:1200px;margin:0 auto 10px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.index button{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:500;color:var(--muted)}
.index button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kick{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* generic bits */
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.big{font-size:34px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--soft)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-top:6px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:10px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-bg);border-color:var(--good)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn)}
.chip.pend{color:var(--muted);border-style:dashed}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:4px 8px 4px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12px}
td.r,th.r{text-align:right}
.t{height:6px;background:var(--ghost);border-radius:3px;position:relative}
.t i{display:block;height:100%;background:var(--bar);border-radius:3px}
.t i.part{background:transparent;border:1px solid var(--bar);height:100%}
svg{max-width:100%;height:auto;display:block}
svg text{font-family:inherit;fill:var(--fg)}
svg .m{fill:var(--muted)}
.cover{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.cover h1{font-size:clamp(28px,5vw,46px);margin:6px 0 4px;font-weight:700;line-height:1.1}
/* funnel */
.fun td,.fun th{padding-right:10px}
.fun .st{font-weight:600;white-space:nowrap}
.fun .cell{min-width:64px}
.fun .cell .v{font-weight:600;font-size:13px}
.fun .leak td{background:var(--bad-bg)}
.fun .na{color:var(--muted);font-weight:400}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0 8px}.stg{text-align:center;min-width:64px}.stg .l,.rt .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:3px}.arr{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.rt{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--soft)}.rt.leak{background:var(--bad-bg);border-color:var(--bad)}
.conv{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* team board */
.trow{display:grid;grid-template-columns:90px 1fr 84px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.trk{position:relative;height:14px;background:var(--ghost);border-radius:2px}
.trk .f{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:2px}
.trk .f.lo{background:var(--bar2)}
.trk .tick{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1px dashed var(--muted)}
/* org / depth */
.rootbox{display:inline-block;border:1.5px solid var(--fg);border-radius:4px;padding:8px 14px;max-width:100%}
.rootbox b{display:block;font-size:14px}
.stem{width:1px;height:14px;background:var(--line);margin-left:24px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:0}
.lane::before{content:"";display:block;width:1px;height:14px;background:var(--line);margin:0 0 6px 24px}
.lane h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.pc{display:flex;justify-content:space-between;gap:6px;align-items:baseline;border:1px solid var(--fg);border-radius:4px;padding:3px 7px;margin-bottom:4px;font-size:11px;line-height:1.3}
.pc b{font-weight:600;overflow-wrap:anywhere}.pc i{font-style:normal;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pc.stale{border-style:dashed;border-color:var(--bar2);color:var(--muted)}
.more{font-size:10px;color:var(--muted);padding:2px 0}
.empty{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.pill{border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:11px;margin:0 4px 4px 0;display:inline-block}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.q{border-bottom:1px solid var(--line);padding:10px 0}
.q b{font-weight:600}
.dec{display:grid;grid-template-columns:78px 1fr;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}
.legend td{font-size:12px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
.blk h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;font-weight:700}

@media (max-width:640px){
  .trow{grid-template-columns:70px 1fr 70px}
  .dec{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
/* ===== TV slide layer: blocky, big, calm ===== */
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html,body{height:100%}
body{padding:0;overflow:hidden;-webkit-text-size-adjust:100%;font-weight:500}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;--aw:clamp(36px,3.75vw,72px)}
.strip{flex:none;display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--bg);min-height:clamp(46px,5.4vh,64px)}
#topbar{border-bottom:3px solid var(--fg)}
#botbar{border-top:3px solid var(--fg);flex-wrap:wrap;display:none}
#app[data-view="home"] #topbar{display:none}
#app[data-view="car"] #botbar,#app[data-view="all"] #botbar,#app[data-view="jo"] #botbar{display:flex}
.blk{background:var(--fg);color:var(--bg);border:2px solid var(--fg);border-radius:0;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(11px,1.05vw,16px);padding:.65em 1.1em;white-space:nowrap}
.blk.ghost{background:transparent;color:var(--fg)}
.blk[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.blk[aria-pressed="false"]{background:transparent;color:var(--fg)}
.blk:disabled{opacity:.35}
.ttl{font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(12px,1.25vw,20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cnt2{margin-left:auto;font-weight:800;font-size:clamp(12px,1.2vw,18px);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px;flex:none}
#tclock{font-size:clamp(11px,1vw,15px);font-weight:700;color:var(--muted);white-space:nowrap}
.tblock{border:0;border-radius:0;background:var(--fg);color:var(--bg);font-weight:900;font-size:clamp(22px,2.7vw,42px);line-height:1;padding:.18em .55em;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tblock.amber{background:var(--warn)}
.tblock.red{background:var(--bad)}
.tblock.run{box-shadow:inset 0 -.14em 0 var(--good)}
#app:not([data-view="tile"]) #bids,#app:not([data-view="tile"]) #bnext,#app:not([data-view="tile"]) #tblock,#app:not([data-view="tile"]) #treset{display:none}
#app:not([data-view="grid"]) #mreset{display:none}
#app.partner #bids,#app.partner #bnext,#app.partner #tblock,#app.partner #treset,#app.partner #mreset,#app.partner #tclock{display:none!important}
#stage{flex:1;min-height:0;position:relative;background:var(--bg)}
#homeview,#gridview,#deckview{position:absolute;inset:0}
/* deck, arrows */
.deck{position:absolute;top:0;bottom:0;left:var(--aw);right:var(--aw);display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}
.cell{width:100%;height:100%;container-type:size;display:grid;place-items:center}
.st{position:relative;width:min(100cqw,calc(100cqh*16/9));aspect-ratio:16/9;container-type:inline-size;background:transparent;overflow:hidden;color:var(--fg)}
.st::before{content:"";position:absolute;inset:0;background:var(--globe) no-repeat right 4% center/auto 96%;opacity:.028;pointer-events:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st::before,:root:not([data-theme="light"]) #homeview::before,:root:not([data-theme="light"]) #gridview::before{filter:invert(1);opacity:.035}}
:root[data-theme="dark"] .st::before,:root[data-theme="dark"] #homeview::before,:root[data-theme="dark"] #gridview::before{filter:invert(1);opacity:.035}
.arrow{position:absolute;top:0;bottom:0;width:var(--aw);border:0;border-radius:0;background:var(--ghost);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;z-index:3}
.arrow.l{left:0}.arrow.r{right:0}
.arrow svg{width:70%;height:auto;max-height:30%}
.arrow:hover:not(:disabled),.arrow:active:not(:disabled){background:var(--fg);color:var(--bg)}
.arrow:disabled{opacity:.3}
.si{position:absolute;inset:0;padding:4.2cqw 5.5cqw 4cqw;display:flex;flex-direction:column;z-index:1}
.k{font-size:1.7cqw;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.hd{font-size:6.4cqw;line-height:1;font-weight:900;text-transform:uppercase;letter-spacing:-.015em;margin:1.2cqw 0 0}
.hd.xl{font-size:8.6cqw}.hd.md{font-size:4.8cqw;line-height:1.05}
.bn{font-weight:900;line-height:.82;letter-spacing:-.04em;flex:1;display:flex;align-items:center}
.bn.b1{font-size:31cqw}.bn.b2{font-size:22cqw}.bn.b3{font-size:15cqw}.bn.b4{font-size:9cqw}
.bn.mid{font-size:19cqw;flex:none;margin:1.5cqw 0 .6cqw}
.sp{flex:1}
.ln{font-size:2.5cqw;font-weight:500;color:var(--muted);margin:0;line-height:1.25;max-width:80cqw}
.ln2{font-size:2.1cqw;font-weight:600;color:var(--muted);margin-top:1cqw}
.bk{display:grid;gap:1.4cqw;flex:1;margin:2.2cqw 0}
.bk.four{flex:none;height:13.5cqw;grid-template-columns:repeat(4,1fr);margin:0}
.bl{background:var(--soft);padding:2cqw 2.2cqw;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.bl b{font-size:8.4cqw;font-weight:900;line-height:1;letter-spacing:-.03em;overflow-wrap:anywhere}
.bk.four .bl b{font-size:4.6cqw;white-space:nowrap}
.bk.four .bl{padding:1.4cqw 1.8cqw}
.lc .l{font-size:1.45cqw!important}
.bl .l,.fb .l,.lc .l{font-size:1.8cqw;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.bl .n,.fb .n{font-size:1.5cqw;font-weight:600;opacity:.75}
.bl.ink,.fb.ink{background:var(--fg);color:var(--bg)}
.bl.warn{background:var(--warn-bg);border-left:1.1cqw solid var(--warn)}
.bl.bad,.fb.leak{background:var(--bad-bg);border-left:1.1cqw solid var(--bad)}
.bl.good{background:var(--good-bg);border-left:1.1cqw solid var(--good)}
.fl{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw;flex:1;margin:2.4cqw 0}
.fb{background:var(--soft);padding:1.8cqw;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.fb b{font-size:6.4cqw;font-weight:900;line-height:1;letter-spacing:-.03em}
.fl.sm{flex:none;height:13cqw;margin:auto 0 0}
.fl.sm .fb b{font-size:4.2cqw}
.rws{display:flex;flex-direction:column;margin-top:1.8cqw;flex:1;min-height:0}
.rw{display:flex;justify-content:space-between;align-items:center;gap:2cqw;border-bottom:.3cqw solid var(--line);border-left:1cqw solid transparent;padding:.4cqw 0 .4cqw 1.6cqw;flex:1 1 0;max-height:9cqw;min-height:0}
.rw.bad{border-left-color:var(--bad)}.rw.warn{border-left-color:var(--warn)}.rw.good{border-left-color:var(--good)}
.ra{min-width:0}
.ra b{display:block;font-size:3cqw;font-weight:800;line-height:1.1}
.ra span{display:block;font-size:1.7cqw;font-weight:500;color:var(--muted);margin-top:.25cqw}
.rb{font-size:3cqw;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.rw.bad .rb{color:var(--bad)}.rw.good .rb{color:var(--good)}.rw.warn .rb{color:var(--warn)}
.brs{display:flex;flex-direction:column;gap:1.8cqw;flex:1;justify-content:center}
.br2{display:grid;grid-template-columns:15cqw 1fr 10cqw;align-items:center;gap:2cqw}
.bnm{font-size:3cqw;font-weight:800}
.trk2{height:5cqw;background:var(--ghost)}
.trk2 i{display:block;height:100%;background:var(--fg)}
.bv{font-size:4.6cqw;font-weight:900;text-align:right}
.lns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1cqw;flex:1;margin-top:2cqw;min-height:0}
.lc{background:var(--soft);padding:1.6cqw;display:flex;flex-direction:column;min-width:0}
.lc.zero{opacity:.55}
.lc b{font-size:9cqw;font-weight:900;line-height:1;margin:.6cqw 0 1cqw;letter-spacing:-.03em}
.lc ul{list-style:none;margin:0;padding:0;font-size:1.9cqw;font-weight:700;line-height:1.35}
.lc li.stale{color:var(--muted);font-weight:500}
.note{position:absolute;right:1.2cqw;bottom:1cqw;z-index:2;border:.2cqw solid var(--line);background:var(--card);color:var(--fg);border-radius:0;padding:.4cqw 1.1cqw;font-size:1.3cqw;font-weight:700}
/* JO deck */
.joh{display:flex;justify-content:space-between;align-items:flex-start;gap:2cqw}
.joh .hd{flex:1;min-width:0}
.prio{flex:none;padding:1cqw 2.2cqw;font-size:2.8cqw;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-top:1.4cqw}
.prio.hot{background:var(--bad);color:var(--bg)}
.prio.active{background:var(--fg);color:var(--bg)}
.prio.new{background:var(--soft);outline:.3cqw solid var(--fg);outline-offset:-.3cqw}

.own{font-size:2.3cqw;font-weight:800;margin-top:1.4cqw}
.sell{font-size:2.3cqw;font-weight:600;color:var(--muted);margin:1.4cqw 0 0;line-height:1.25}
.pfoot{position:absolute;left:5.5cqw;bottom:1.2cqw;z-index:2;font-size:1.2cqw;font-weight:700;color:var(--muted);letter-spacing:.04em}
.jo .rw{max-height:8cqw}
/* home and topic tiles */
#homeview,#gridview{overflow-y:auto;padding:max(18px,2.6vw)}
#homeview{display:flex;flex-direction:column}
#homeview::before,#gridview::before{content:"";position:absolute;inset:0;background:var(--globe) no-repeat right 4% center/auto 96%;opacity:.028;pointer-events:none}
#homeview>*,#gridview>*{position:relative}
.ht{font-size:clamp(30px,6vw,104px);line-height:.95;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:.1em 0 .35em}
.kk{font-size:clamp(11px,1.2vw,20px);letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.mtg,.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.2vw,22px);flex:1;min-height:0}
.tg{grid-template-columns:repeat(auto-fill,minmax(clamp(150px,18vw,340px),1fr));flex:none}
.gt{font-size:clamp(30px,6vw,96px);line-height:.95;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:.1em 0 .4em}
.mt{border:0;border-radius:2px;text-align:left;padding:clamp(12px,2vw,36px);display:flex;flex-direction:column;justify-content:flex-end;gap:.3em;min-height:clamp(90px,16vh,200px);color:var(--fg);background:var(--soft);position:relative;overflow:hidden}
.mt b{font-size:clamp(22px,4vw,74px);font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-.02em}

.mt.c1,.mt.c5,.mt.g1{background:var(--fg);color:var(--bg)}
.mt.c2,.mt.c6,.mt.g2{background:var(--card);box-shadow:inset 0 0 0 .22vw var(--fg)}
.mt.c3,.mt.g3{background:var(--ghost)}
.mt.c4,.mt.g4{background:var(--soft)}

<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
var M = D.meta || {};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function nv(v){return (v===null||v===undefined||v==="")?"–":v;}
function num(v){return typeof v==="number"?v:0;}
function fmt(v){return typeof v==="number"?v.toLocaleString("en-US"):nv(v);}
function pct(a,b){return b>0?Math.max(0,Math.min(100,a/b*100)):0;}
var PARTIAL_TAG = "partial week";
var cards = [], sections = [];

function add(id, sec, kick, title, body, src, opts){
  cards.push({id:id, sec:sec, kick:kick, title:title, body:body, src:src||"", cls:(opts&&opts.cls)||""});
}
function secStart(key,label){sections.push({key:key,label:label,first:cards.length});}

/* ---------- 1 cover ---------- */
secStart("cover","Cover");
(function(){
  var f=D.flow||{}, wk=(f.weeks||[]), p=wk.filter(function(w){return w.partial;})[0]||{v:{}}, J=D.jos||{}, I=D.intv||{};
  var tm=D.team||{};
  var b='<div class="cover"><div class="kick">'+esc(M.round_table||"")+'</div>'+
    '<h1>Friday Pipeline Review<br><span style="font-weight:500">'+esc(M.date)+'</span></h1>'+
    '<div class="muted" style="margin-bottom:6px">Data pulled '+esc(M.pulled)+'. JO board as of '+esc(M.board_asof)+'.</div>'+
    '<div><span class="chip warn">'+esc(M.partial_label)+'</span></div>'+
    '<div class="stats" style="margin-top:22px">'+
    stat(num(tm.total)+' <span class="muted" style="font-size:16px">/ '+num(tm.goal)+'</span>','RPs this week so far')+
    stat(fmt(tm.dials),'Dials so far')+stat('<span class="bad">'+nv((p.v||{}).resumes)+'</span> <span class="muted" style="font-size:16px">resumes</span>','So far this week')+
    stat(nv(J.total),'Active JOs')+
    stat(nv(I.people),'Interviewing now')+
    '</div><div class="muted" style="font-size:12px">Swipe, use the arrow keys, or pick a section above. Add a note on any card for Nick.</div></div>';
  add("cover","cover","Round Table","Cover",b,"Crelate API v3 read-only via Dean and Casey",{cls:"nohead"});
})();
function stat(v,l){return '<div class="stat"><div class="big num">'+v+'</div><div class="l">'+esc(l)+'</div></div>';}

/* ---------- 2 RPA flow ---------- */
secStart("flow","RPA flow");
(function(){
  var f=D.flow||{}, W=f.weeks||[], S=f.stages||[], RT=f.ratios||[], lk=f.leak||{};
  var P=W.filter(function(w){return w.partial;})[0]||{v:{},ratio:{}};
  var LEAKK="rr";
  var strip='<div class="strip">'+S.map(function(s,i){
    var v=(P.v||{})[s.k];
    return '<div class="stg"><div class="num big" style="font-size:24px">'+(v==null?"n/a":fmt(v))+'</div><div class="l">'+esc(s.n)+'</div></div>'+
      (i<S.length-1?'<div class="arr" aria-hidden="true">→</div>':'');
  }).join("")+'</div>';
  var tiles=RT.map(function(r){
    var v=(P.ratio||{})[r.k], av=(f.avg_ratio||{})[r.k], leak=r.k===LEAKK;
    return '<div class="rt'+(leak?' leak':'')+'"><div class="big num '+(leak?'bad':'')+'">'+(v==null?"n/a":v)+'</div><div class="l">'+esc(r.n)+'</div><div class="muted num" style="font-size:10px;margin-top:3px">'+(av==null?"no 4-wk figure":"4-wk "+av)+'</div></div>';
  }).join("");
  var head='<tr><th>Stage</th>'+W.map(function(w){return '<th>'+esc(w.label)+(w.partial?'*':'')+'</th>';}).join("")+'</tr>';
  var rows=S.map(function(s){
    var vals=W.map(function(w){return (w.v||{})[s.k];});
    var mx=Math.max.apply(null,vals.map(function(v){return num(v);}).concat([1]));
    return '<tr><td style="font-weight:600">'+esc(s.n)+'</td>'+W.map(function(w,i){var v=vals[i],isN=(v==null);
      return '<td style="min-width:62px"><div class="num '+(isN?'muted':'')+'" style="font-weight:600">'+(isN?"n/a":fmt(v))+(w.partial&&!isN?"*":"")+'</div>'+(isN?'':'<div class="t"><i class="'+(w.partial?'part':'')+'" style="width:'+pct(num(v),mx)+'%"></i></div>')+'</td>';}).join("")+'</tr>';
  }).join("");
  var rrows=RT.map(function(r){
    return '<tr><td class="muted">'+esc(r.n)+'</td>'+W.map(function(w){var v=(w.ratio||{})[r.k];return '<td class="num '+(v==null?'muted':'')+'">'+(v==null?"n/a":v)+'</td>';}).join("")+'</tr>';
  }).join("");
  var wr=lk.worst;
  var head2='Resumes are the leak: <span class="bad num">'+nv(lk.resumes_first)+'</span> a week on '+esc(lk.first_label||"")+', <span class="bad num">'+nv(lk.resumes_last)+'</span> on '+esc(lk.last_label||"")+', <span class="bad num">'+nv(lk.resumes_this)+'</span> so far this week.';
  var b=strip+'<div style="font-size:15px;font-weight:600;line-height:1.3;margin:6px 0 10px">'+head2+
    (wr?' And dials barely turn into RPs: '+esc(wr.name)+' made <span class="num">'+fmt(wr.dials)+'</span> dials for <span class="num">'+wr.rps+'</span> RPs.':'')+'</div>'+
    '<div class="tiles">'+tiles+'</div>'+
    '<div class="sec">Dial, RP, Resume, PTC, FTI by week</div><div class="tw"><table style="min-width:420px">'+head+rows+'<tr><th colspan="'+(W.length+1)+'" style="padding-top:10px">Ratios, per 100 of the step before</th></tr>'+rrows+'</table></div>'+
    '<div class="muted" style="font-size:10px;margin-top:6px">* '+esc(M.partial_label)+'. Five headhunters; Nick and Kev sit below the line. Dials are CloudTalk outbound calls for this week only ('+esc(f.dial_pulled||"")+'); earlier weeks have no dial data. Submittals, screens, offers and placements are not part of the flow.</div>';
  add("rpa-flow","flow","RPA flow in the business today","Dial, RP, Resume, PTC, FTI",b,"Dean (Crelate) and Radar (CloudTalk dials), "+PARTIAL_TAG);
})();

/* ---------- 3 team board ---------- */
secStart("team","Team");
(function(){
  var R=D.recs||[], T=D.team||{}, per=T.per||75, day=T.day||15, pace=day*4;

    var v=r.vals||{}, rp=num(v.rps), lo=rp<pace;

  }

  var b='<div class="stats"><div class="stat"><div class="big num">'+nv(T.total)+' <span class="muted" style="font-size:16px">/ '+nv(T.goal)+'</span></div><div class="l">RPs, five headhunters, Mon to Thu</div></div>'+

    '<div class="tw"><table style="min-width:520px">'+hd+R.filter(function(r){return !r.below;}).map(row).join("")+

    '<div class="muted" style="font-size:10px;margin-top:8px">Dashed tick = Thursday pace ('+pace+' RPs). Dial n/a: no CloudTalk dials for Nick and Kev. Last full week: '+nv(T.last_total)+' RPs. Friday is still open.</div>';
  add("team-board","team","Team board","Dial, RP, Resume, PTC, FTI by recruiter",b,"Dean (Crelate) and Radar (CloudTalk), "+PARTIAL_TAG);

var MC={start:null,done:{},iv:null}, T={left:300000,running:false,end:0,fired:false,iv:null,lp:null,lpFired:false}, actx=null;

function clockPaint(){
  var el=$("tclock"); if(!MODES[mode]||!MC.start||(view!=="tile"&&view!=="grid")){el.textContent=""; return;}
  el.textContent=fmtT(Date.now()-MC.start)+" · "+Object.keys(MC.done).length+"/"+MODES[mode].tiles.length+" done";

function clockStart(){ if(!MC.start){MC.start=Date.now(); MC.iv=setInterval(clockPaint,1000);} clockPaint(); }
function clockReset(){ MC.start=null; MC.done={}; if(MC.iv){clearInterval(MC.iv);MC.iv=null;} timerStop(true); clockPaint(); if(view==="grid") renderGrid(); }
function chime(){
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=actx||new AC(); if(actx.state==="suspended") actx.resume();
    [[660,0],[880,.25]].forEach(function(n){var o=actx.createOscillator(), g=actx.createGain(), t0=actx.currentTime+n[1];
      o.type="sine"; o.frequency.value=n[0]; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.08,t0+0.05); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.7);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+0.75);}); }catch(e){}
}
function timerPaint(){
  var cls=T.left<=0?"red":(T.left<=60000?"amber":"");
  $("ttime").textContent=fmtT(T.left); $("tblock").className="tblock "+cls+(T.running?" run":"");
  $("tblock").setAttribute("aria-label","Timer "+fmtT(T.left)+(T.running?", running. Press to pause.":". Press to start."));
}
function timerStop(reset){ if(T.iv){clearInterval(T.iv);T.iv=null;} T.running=false; if(reset){T.left=300000;T.fired=false;} timerPaint(); }
function timerStart(){
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC){actx=actx||new AC(); if(actx.state==="suspended")actx.resume();} }catch(e){}
  if(T.running) return; if(T.left<=0){timerStop(true);} clockStart(); T.running=true; T.end=Date.now()+T.left;
  T.iv=setInterval(function(){
    T.left=T.end-Date.now();
    if(T.left<=0){T.left=0; clearInterval(T.iv); T.iv=null; T.running=false; if(!T.fired){T.fired=true; chime(); markDone(); $("live").textContent="Time is up for this topic.";}}

}

function setView(v){
  view=v; var app=$("app"); app.setAttribute("data-view",v);
  $("homeview").hidden=v!=="home"; $("gridview").hidden=v!=="grid"; $("deckview").hidden=!(v==="all"||v==="car"||v==="tile"||v==="jo");
  if(v!=="car"){ carStop(); } if(v!=="tile"&&v!=="grid"){ timerStop(false); closeSheet(); }
  var t=MODES[mode]&&MODES[mode].tiles[tileIdx];
  $("ttl").textContent=v==="tile"&&t?MODES[mode].label+" · "+t.label:(v==="grid"?MODES[mode].label:(v==="car"?"Carousel":(v==="all"?"All cards":(v==="jo"?"Open roles":""))));
  clockPaint();
}
function route(force){
  var h=(location.hash||"").replace(/^#/,"");
  if(h==="carousel"){ if(DK.kind!=="car"||force){mountDeck(CAR_IDS,"car");} setView("car"); carPaint(); carRun(); deckEl.scrollTo({left:DK.cur*deckEl.clientWidth,behavior:"auto"}); paintCount(); return; }
  var mt=h.match(/^([a-z]+)-t(\d+)$/);
  if(mt&&MODES[mt[1]]&&MODES[mt[1]].tiles[+mt[2]]){
    if(mode!==mt[1]){ if(mode&&MC.start) clockReset(); mode=mt[1]; showSolved=false; }
    if(view==="tile"&&tileIdx===+mt[2]&&!force) return;
    tileIdx=+mt[2]; h=mode;
  } else if(MODES[h]){ tileIdx=-1; }
  if(MODES[h]){
    if(mode!==h){ if(mode&&MC.start) clockReset(); mode=h; tileIdx=-1; showSolved=false; }
    if(tileIdx<0){ setView("grid"); renderGrid(); }
    else { var t=MODES[mode].tiles[tileIdx]; timerStop(true); mountDeck(t.cards,"tile"); setView("tile"); clockStart(); loadDraft(); renderIssues(); timerPaint(); }
    return;
  }
  if(h==="jo-deck"||(JOS.length&&/^jo-(\d|r-)/.test(h)&&byId[h])){
    paintJoFil();
    if(/^jo-\d/.test(h)){ var jj=null; JOS.forEach(function(x){if(x.id===h) jj=x;});
      if(!(h in DK.first)||DK.kind!=="jo1"){ var rid=rslug(jj._m); mountDeck([rid].concat(JOS.filter(function(x){return x._m===jj._m&&joMatch(x);}).map(function(x){return x.id;})).filter(function(id){return byId[id];}),"jo1"); } }
    else if(DK.kind!=="jo"||force||!(h in DK.first)){mountDeck(joIds(),"jo");}
    setView("jo");
    var ji=(h in DK.first)?DK.first[h]:0; goSlide(ji,true); slideChanged(ji); return;
  }
  if(h==="all"||byId[h]){
    if(DK.kind!=="all"||force){mountDeck(ALL_IDS,"all");} setView("all");
    var i=(h in DK.first)?DK.first[h]:(h==="all"?DK.cur:0); goSlide(i,true); slideChanged(i); return;
  }
  setView("home");
}

<script>
/* Keep big numbers inside their blocks (Kev, 13 Nov: "numbers are outside of text"). */
(function(){
  function fitAll(){
    var els=document.querySelectorAll('.st .num, .st .bn, .st .bv');
    for(var i=0;i<els.length;i++){
      var el=els[i], box=el.parentElement; if(!box) continue;
      el.style.fontSize=''; el.style.whiteSpace='nowrap';
      var cs=getComputedStyle(box), avail=box.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
      if(avail<=0) continue;
      var rg=document.createRange(); rg.selectNodeContents(el);
      var w=rg.getBoundingClientRect().width, fs=parseFloat(getComputedStyle(el).fontSize), n=0;
      while(w>avail*0.96 && fs>10 && n<30){ fs*=0.9; el.style.fontSize=fs+'px'; w=rg.getBoundingClientRect().width; n++; }
    }
  }
  var t; function later(){ clearTimeout(t); t=setTimeout(fitAll,120); }
  window.addEventListener('resize',later); window.addEventListener('hashchange',later);
  document.addEventListener('click',later,true);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(later);
  setTimeout(fitAll,400); setTimeout(fitAll,1500);
})();
</script>
