<title>Friday Pipeline Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap");
:root{
  --bg:#F6F3EB; --card:#FFFFFF; --soft:#F1EDE2; --fg:#111111; --muted:#6A6760; --line:#DAD5C8;
  --bar:#111111; --bar2:#A7A398; --ghost:#E4DFD2;
  --good:#3D6B4F; --bad:#8A3A32; --warn:#7A5A1C;
  --good-bg:#E4ECE6; --bad-bg:#F0E2DF; --warn-bg:#F1E8D4;
  --focus:#111111;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C0C; --card:#151515; --soft:#1C1C1B; --fg:#ECE9E1; --muted:#9A968D; --line:#2C2B29;
    --bar:#ECE9E1; --bar2:#6B6861; --ghost:#262522;
    --good:#7FAE90; --bad:#CC7B71; --warn:#C9A25C;
    --good-bg:#1B2A21; --bad-bg:#2D1B19; --warn-bg:#2B2316;
    --focus:#ECE9E1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --card:#151515; --soft:#1C1C1B; --fg:#ECE9E1; --muted:#9A968D; --line:#2C2B29;
  --bar:#ECE9E1; --bar2:#6B6861; --ghost:#262522;
  --good:#7FAE90; --bad:#CC7B71; --warn:#C9A25C;
  --good-bg:#1B2A21; --bad-bg:#2D1B19; --warn-bg:#2B2316;
  --focus:#ECE9E1; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 18px;overflow-x:hidden}
*{min-width:0}
.num,td,th,.n{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto 10px}
.brand{font-weight:700;letter-spacing:.22em;font-size:12px}
.doc{font-weight:700;font-style:italic;font-size:15px}
.sub{color:var(--muted);font-size:11px}
.index{max-width:1200px;margin:0 auto 10px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.index button{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:500;color:var(--muted)}
.index button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.deckwrap{max-width:1200px;margin:0 auto;position:relative}
.track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;scroll-behavior:auto}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:2px 3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;height:calc(100dvh - 215px);min-height:520px;max-height:860px;display:flex;flex-direction:column}
.card-h{padding:16px 20px 8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.kick{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{margin:2px 0 0;font-size:20px;line-height:1.2;font-weight:700}
.card-b{padding:6px 20px 14px;overflow-y:auto;flex:1 1 auto}
.card-f{padding:8px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:10px;color:var(--muted);flex-wrap:wrap}
.note{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:11px;font-weight:600}
.note:hover{background:var(--soft)}
.nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding:0}
.nav:disabled{opacity:.3;cursor:default}
.pos{max-width:1200px;margin:10px auto 0;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}
.foot{max-width:1200px;margin:10px auto 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:600}
/* generic bits */
.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.big{font-size:34px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--soft)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-top:6px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:10px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-bg);border-color:var(--good)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn)}
.chip.pend{color:var(--muted);border-style:dashed}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:4px 8px 4px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12px}
td.r,th.r{text-align:right}
.t{height:6px;background:var(--ghost);border-radius:3px;position:relative}
.t i{display:block;height:100%;background:var(--bar);border-radius:3px}
.t i.part{background:transparent;border:1px solid var(--bar);height:100%}
svg{max-width:100%;height:auto;display:block}
svg text{font-family:inherit;fill:var(--fg)}
svg .m{fill:var(--muted)}
.cover{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.cover h1{font-size:clamp(28px,5vw,46px);margin:6px 0 4px;font-weight:700;line-height:1.1}
/* funnel */
.fun td,.fun th{padding-right:10px}
.fun .st{font-weight:600;white-space:nowrap}
.fun .cell{min-width:64px}
.fun .cell .v{font-weight:600;font-size:13px}
.fun .leak td{background:var(--bad-bg)}
.fun .na{color:var(--muted);font-weight:400}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0 8px}.stg{text-align:center;min-width:64px}.stg .l,.rt .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:3px}.arr{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.rt{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--soft)}.rt.leak{background:var(--bad-bg);border-color:var(--bad)}
.conv{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* team board */
.trow{display:grid;grid-template-columns:90px 1fr 84px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.trk{position:relative;height:14px;background:var(--ghost);border-radius:2px}
.trk .f{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:2px}
.trk .f.lo{background:var(--bar2)}
.trk .tick{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1px dashed var(--muted)}
/* org / depth */
.rootbox{display:inline-block;border:1.5px solid var(--fg);border-radius:4px;padding:8px 14px;max-width:100%}
.rootbox b{display:block;font-size:14px}
.stem{width:1px;height:14px;background:var(--line);margin-left:24px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:0}
.lane::before{content:"";display:block;width:1px;height:14px;background:var(--line);margin:0 0 6px 24px}
.lane h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;gap:6px}
.pc{display:flex;justify-content:space-between;gap:6px;align-items:baseline;border:1px solid var(--fg);border-radius:4px;padding:3px 7px;margin-bottom:4px;font-size:11px;line-height:1.3}
.pc b{font-weight:600;overflow-wrap:anywhere}.pc i{font-style:normal;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pc.stale{border-style:dashed;border-color:var(--bar2);color:var(--muted)}
.more{font-size:10px;color:var(--muted);padding:2px 0}
.empty{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.pill{border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:11px;margin:0 4px 4px 0;display:inline-block}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.q{border-bottom:1px solid var(--line);padding:10px 0}
.q b{font-weight:600}
.dec{display:grid;grid-template-columns:78px 1fr;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}
.legend td{font-size:12px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}
.blk h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;font-weight:700}

/* meeting room */
[hidden]{display:none!important}
#mh:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pillb{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:11px;font-weight:600}
.pillb:hover{background:var(--soft)}
.pillb[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wrapm{max-width:1200px;margin:0 auto}
.hh{font-size:clamp(24px,4.5vw,40px);line-height:1.1;margin:4px 0 6px;font-weight:700}
.hp{margin:0 0 18px;max-width:60ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;min-height:130px}
.mode:hover{background:var(--soft);border-color:var(--fg)}
.mode b{font-size:20px;font-weight:700}
.mode span{color:var(--muted);font-size:12px}
.mode .go{margin-top:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.tile{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:14px;min-height:96px;display:flex;flex-direction:column;gap:4px}
.tile:hover{background:var(--soft);border-color:var(--fg)}
.tile .tn{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.tile b{font-size:14px;line-height:1.25}
.tile span.sb{font-size:11px;color:var(--muted)}
.tile.done{border-style:dashed}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.mbar{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:10px 16px;margin:10px 0}
.mbar .tt{flex:1 1 180px}
.mbar .tt b{font-size:15px}
.timer{font-size:clamp(40px,9vw,60px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.amber{color:var(--warn)}.timer.red{color:var(--bad)}
.mbar.amber{border-color:var(--warn);background:var(--warn-bg)}.mbar.red{border-color:var(--bad);background:var(--bad-bg)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.4;cursor:default}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
@media (min-width:1000px){.mgrid{grid-template-columns:minmax(0,1fr) 340px}.pad{position:sticky;top:8px}}
.mcards{display:flex;flex-direction:column;gap:12px}
.mcards .card{height:auto;min-height:0;max-height:none}
.mcards .card-b{overflow:visible}
.pad{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:14px 16px}
.pad h3{margin:0 0 2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.pad label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-top:8px}
.pad textarea,.pad input{width:100%;font:inherit;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400}
.pad textarea{resize:vertical;min-height:52px}
.padrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.issue{border-bottom:1px solid var(--line);padding:8px 0;font-size:12px}
.issue.solved{opacity:.55}
.issue .ih{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.issue label{display:flex;align-items:center;gap:5px;margin:0;font-size:10px;white-space:nowrap}
.issue input{width:auto;margin:0}
.emptyds{border:1px dashed var(--line);border-radius:6px;padding:16px;text-align:center;color:var(--muted);font-size:12px}
.mclock{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 8px 6px 14px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;max-width:calc(100vw - 24px)}
.mclock .pillb{color:var(--bg);border-color:var(--bg);padding:2px 9px}
.mclock .pillb:hover{background:transparent;opacity:.8}
/* carousel */
.car .chead{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;margin-bottom:8px}
.car .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.car .stage{cursor:pointer}
.car .card{height:calc(100dvh - 175px);min-height:420px;max-height:none}
.car .card.enter{animation:cin .35s ease-out}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.car .prog{height:4px;background:var(--ghost);border-radius:2px;margin:6px 0 0}
.car .prog i{display:block;height:100%;width:0;background:var(--bar);border-radius:2px}
.car .dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.car .dots i{width:8px;height:8px;border-radius:50%;background:var(--ghost)}
.car .dots i.on{background:var(--fg)}
@media (min-width:1000px){.car .card-b{zoom:1.3}.car h2{font-size:30px}.car .kick{font-size:12px}}
@media (min-width:1500px){.car .card-b{zoom:1.6}.car h2{font-size:40px}}
@media (prefers-reduced-motion: reduce){.car .card.enter{animation:none}}
:fullscreen body,:fullscreen{background:var(--bg)}
@media (max-width:640px){
  .card{height:calc(100dvh - 190px);min-height:480px}
  .card-h,.card-b,.card-f{padding-left:14px;padding-right:14px}
  h2{font-size:17px}
  .trow{grid-template-columns:70px 1fr 70px}
  .dec{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.globe{width:34px;height:34px;flex:none;opacity:.85}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .globe{filter:invert(1)}}
:root[data-theme="dark"] .globe{filter:invert(1)}
</style>

var PARTIAL_TAG = "partial week";
var cards = [], sections = [];

function add(id, sec, kick, title, body, src, opts){
  cards.push({id:id, sec:sec, kick:kick, title:title, body:body, src:src||"", cls:(opts&&opts.cls)||""});
}
function secStart(key,label){sections.push({key:key,label:label,first:cards.length});}

/* ---------- 2 RPA flow ---------- */
secStart("flow","RPA flow");
(function(){
  var f=D.flow||{}, W=f.weeks||[], S=f.stages||[], RT=f.ratios||[], lk=f.leak||{};
  var P=W.filter(function(w){return w.partial;})[0]||{v:{},ratio:{}};
  var LEAKK="rr";
  var strip='<div class="strip">'+S.map(function(s,i){

    return '<div class="stg"><div class="num big" style="font-size:24px">'+(v==null?"n/a":fmt(v))+'</div><div class="l">'+esc(s.n)+'</div></div>'+
      (i<S.length-1?'<div class="arr" aria-hidden="true">→</div>':'');
  }).join("")+'</div>';
  var tiles=RT.map(function(r){
    var v=(P.ratio||{})[r.k], av=(f.avg_ratio||{})[r.k], leak=r.k===LEAKK;
    return '<div class="rt'+(leak?' leak':'')+'"><div class="big num '+(leak?'bad':'')+'">'+(v==null?"n/a":v)+'</div><div class="l">'+esc(r.n)+'</div><div class="muted num" style="font-size:10px;margin-top:3px">'+(av==null?"no 4-wk figure":"4-wk "+av)+'</div></div>';
  }).join("");
  var head='<tr><th>Stage</th>'+W.map(function(w){return '<th>'+esc(w.label)+(w.partial?'*':'')+'</th>';}).join("")+'</tr>';
  var rows=S.map(function(s){
    var vals=W.map(function(w){return (w.v||{})[s.k];});

    return '<tr><td style="font-weight:600">'+esc(s.n)+'</td>'+W.map(function(w,i){var v=vals[i],isN=(v==null);

  }).join("");
  var rrows=RT.map(function(r){
    return '<tr><td class="muted">'+esc(r.n)+'</td>'+W.map(function(w){var v=(w.ratio||{})[r.k];return '<td class="num '+(v==null?'muted':'')+'">'+(v==null?"n/a":v)+'</td>';}).join("")+'</tr>';
  }).join("");

    (wr?' And dials barely turn into RPs: '+esc(wr.name)+' made <span class="num">'+fmt(wr.dials)+'</span> dials for <span class="num">'+wr.rps+'</span> RPs.':'')+'</div>'+
    '<div class="tiles">'+tiles+'</div>'+
    '<div class="sec">Dial, RP, Resume, PTC, FTI by week</div><div class="tw"><table style="min-width:420px">'+head+rows+'<tr><th colspan="'+(W.length+1)+'" style="padding-top:10px">Ratios, per 100 of the step before</th></tr>'+rrows+'</table></div>'+
    '<div class="muted" style="font-size:10px;margin-top:6px">* '+esc(M.partial_label)+'. Five headhunters; Nick and Kev sit below the line. Dials are CloudTalk outbound calls for this week only ('+esc(f.dial_pulled||"")+'); earlier weeks have no dial data. Submittals, screens, offers and placements are not part of the flow.</div>';
  add("rpa-flow","flow","RPA flow in the business today","Dial, RP, Resume, PTC, FTI",b,"Dean (Crelate) and Radar (CloudTalk dials), "+PARTIAL_TAG);

secStart("people","Recruiters");

    var days=r.days||[], any=days.some(function(d){return d.rps!=null;});
    var mx=Math.max.apply(null,days.map(function(d){return num(d.rps);}).concat([day+4]));
    var bw=44, x0=10, base=96, svg='<svg viewBox="0 0 250 120" role="img" aria-label="RPs by day against '+day+'">';
    days.forEach(function(d,i){
      var x=x0+i*(bw+4), v=d.rps, h=num(v)/mx*80;
      if(d.open&&v==null){
        svg+='<rect x="'+x+'" y="'+(base-18)+'" width="'+bw+'" height="18" fill="none" stroke="var(--bar2)" stroke-dasharray="3 3"/><text x="'+(x+bw/2)+'" y="'+(base-6)+'" font-size="8" text-anchor="middle" class="m">open</text>';
      } else if(v==null){

      } else {
        svg+='<rect x="'+x+'" y="'+(base-h)+'" width="'+bw+'" height="'+h+'" fill="'+(v>=day?'var(--good)':'var(--bad)')+'"/>';
        svg+='<text x="'+(x+bw/2)+'" y="'+(base-h-4)+'" font-size="10" text-anchor="middle" class="n" style="font-weight:600">'+v+'</text>';
      }

    function nl(k,l){var a=(r.names||{})[k]||[];return '<div class="sec" style="margin-top:8px">'+l+' <span class="num">'+a.length+'</span></div>'+(a.length?a.map(function(n){return '<span class="pill">'+esc(n)+'</span>';}).join(""):'<span class="empty">none this week</span>');}
    var jos=(r.jos||[]).slice(0,6).map(function(j){return '<tr><td>'+esc(j.name)+'</td><td class="r num">'+j.rps+' RPs</td><td class="r num muted">'+(j.ptcs?j.ptcs+' PTC':'')+'</td></tr>';}).join("");
    var nx=(r.next||[]);

      return '<tr><td class="num muted">'+nv(j.order)+'</td><td><b>'+esc(j.client)+'</b> '+esc(j.role)+'<div class="muted" style="font-size:10px">'+esc(j.seat)+(i<3&&j.push?' · '+esc(j.push):'')+'</div></td><td class="r num muted" style="white-space:nowrap">P'+j.ptc+' R'+j.sub+' I'+j.int+'</td></tr>';

/* ---------- 5 JO overview ---------- */
secStart("jos","Active JOs");
(function(){
  var J=D.jos||{}, rows=J.rows||[];
  var risk=rows.filter(function(r){return r.risk;}).sort(function(a,b){return a.risk-b.risk;});
  function chips(r){
    var c=[];
    if(r.risk)c.push('<span class="chip bad">at risk</span>');
    if(r.status==="new")c.push('<span class="chip">new</span>');
    if(r.status==="kill?")c.push('<span class="chip warn">kill?</span>');
    if(r.nocand)c.push('<span class="chip warn">no candidates</span>');
    if(r.nolead)c.push('<span class="chip warn">needs lead</span>');
    return c.join(" ");
  }
  var tbl=rows.map(function(r){
    var q=num(r.quiet);
    return '<tr data-r="'+(r.risk?1:0)+'" data-n="'+(r.nocand?1:0)+'" data-l="'+(r.nolead?1:0)+'"><td><b>'+esc(r.client)+'</b> '+esc(r.role)+'<div class="muted" style="font-size:10px">'+esc(r.loc)+'</div></td>'+
      '<td>'+esc(nv(r.owner==null?"no owner":r.owner))+'</td>'+
      '<td class="r num">'+r.sourced+'</td><td class="r num">'+r.ptc+'</td><td class="r num">'+r.sub+'</td><td class="r num">'+r.int+'</td>'+
      '<td style="min-width:92px"><div class="t"><i style="width:'+pct(q,30)+'%;background:'+(q>=14?'var(--bad)':q>=7?'var(--warn)':'var(--bar)')+'"></i></div><div class="num muted" style="font-size:10px">'+nv(r.quiet)+' d quiet</div></td>'+
      '<td>'+chips(r)+'</td></tr>';
  }).join("");
  var rk=risk.map(function(r){return '<div class="q"><span class="chip bad">'+r.risk+'</span> <b>'+esc(r.client)+'</b> '+esc(r.role)+' <span class="muted num">· '+nv(r.quiet)+' days quiet · '+esc(nv(r.owner==null?"no owner":r.owner))+'</span><div class="muted" style="font-size:11px">'+esc(r.next||"")+'</div></div>';}).join("");
  var bs=J.by_status||{};
  var b='<div class="stats"><div class="stat"><div class="big num">'+nv(J.total)+'</div><div class="l">Active JOs ('+nv(bs.active)+' active, '+nv(bs["new"])+' new, '+nv(bs["kill?"])+' kill?)</div></div>'+
    '<div class="stat"><div class="big num warn">'+nv(J.no_cand)+'</div><div class="l">No candidates</div></div>'+
    '<div class="stat"><div class="big num warn">'+nv(J.need_lead)+'</div><div class="l">Need a lead recruiter</div></div>'+
    '<div class="stat"><div class="big num bad">'+risk.length+'</div><div class="l">Most at risk</div></div></div>'+
    (rk?'<div class="sec">Most at risk</div>'+rk:'')+
    '<div class="sec">All active JOs</div><div class="filters" id="jofil"><button aria-pressed="true" data-f="all">All</button><button aria-pressed="false" data-f="r">At risk</button><button aria-pressed="false" data-f="n">No candidates</button><button aria-pressed="false" data-f="l">Needs lead</button></div>'+
    '<div class="tw"><table id="jotbl" style="min-width:680px"><tr><th>JO</th><th>Owner</th><th class="r">Sourced</th><th class="r">PTC</th><th class="r">Resume sent</th><th class="r">Int</th><th>Quiet</th><th>Flags</th></tr>'+tbl+'</table></div>';
  add("active-jos","jos","JO board","60 active JOs".replace("60",String(J.total||"")),b,"Casey, Team Hub board (last edit 9 Nov) and Crelate stage history, "+M.board_asof);
})();

function clockStart(){ if(!MC.start){MC.start=Date.now(); MC.iv=setInterval(clockPaint,1000);} clockPaint(); }

function chime(){
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=actx||new AC(); if(actx.state==="suspended") actx.resume();
    [[660,0],[880,.25]].forEach(function(n){var o=actx.createOscillator(), g=actx.createGain(), t0=actx.currentTime+n[1];
      o.type="sine"; o.frequency.value=n[0]; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.08,t0+0.05); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.7);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+0.75);}); }catch(e){}
}
function timerPaint(){
  var el=$("timer"), bar=$("mbar"); if(!el) return;
  el.textContent=fmtT(T.left);
  var cls=T.left<=0?"red":(T.left<=60000?"amber":"");
  el.className="timer "+cls; bar.className="mbar "+cls;
  var s=$("tstart"), p=$("tpause"); if(s){s.disabled=T.running||T.left<=0; p.disabled=!T.running; s.textContent=T.running?"Running":((T.left<300000&&T.left>0)?"Resume":"Start");}
}
function timerStop(reset){ if(T.iv){clearInterval(T.iv);T.iv=null;} T.running=false; if(reset){T.left=300000;T.fired=false;} timerPaint(); }
function timerStart(){
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC){actx=actx||new AC(); if(actx.state==="suspended")actx.resume();} }catch(e){}
  if(T.running||T.left<=0) return; clockStart(); T.running=true; T.end=Date.now()+T.left;
  T.iv=setInterval(function(){
    T.left=T.end-Date.now();
    if(T.left<=0){T.left=0; clearInterval(T.iv); T.iv=null; T.running=false; if(!T.fired){T.fired=true; chime(); markDone(); $("live").textContent="Time is up for this topic.";}}
    timerPaint();
  },250);
  timerPaint();
}

(async function(){
  try{ if(window.claude&&typeof window.claude.use==="function"){
    try{ var u=await window.claude.use("user"); uid=u&&u.id?await u.id():null; }catch(e){ uid=null; }
    dbh=await window.claude.use("db"); } }catch(e){ dbh=null; }

    dbh.collection("ids").onSnapshot(function(s){

      clearTimeout(loadTimer); dbState="ready"; renderIssues();

var CAR={i:0,secs:+(ls("car-secs")||20),manual:false,hover:false,elapsed:0,iv:null,last:0};
if([10,20,60].indexOf(CAR.secs)<0) CAR.secs=20;
function carShow(i,anim){
  CAR.i=(i+CAR_IDS.length)%CAR_IDS.length; CAR.elapsed=0;
  var st=$("cstage"); if(!st) return; st.innerHTML=""; var a=makeCard(CAR_IDS[CAR.i]); if(!a) return;
  if(anim&&!reduce) a.className+=" enter"; st.appendChild(a);
  $("cdots").innerHTML=CAR_IDS.map(function(_,k){return '<i'+(k===CAR.i?' class="on"':'')+'></i>';}).join("");
  $("cprog").style.width="0%"; $("clive").textContent=byId[CAR_IDS[CAR.i]].title;
}
function carPaused(){return CAR.manual||CAR.hover;}
function carPaint(){ var b=$("cpause"); if(b){b.textContent=carPaused()?"Play":"Pause"; b.setAttribute("aria-pressed",CAR.manual?"true":"false");} var s=$("cstate"); if(s) s.textContent=carPaused()?"Paused":""; }
function carRun(){
  carStop(); CAR.last=Date.now();
  CAR.iv=setInterval(function(){
    var now=Date.now(), dt=now-CAR.last; CAR.last=now; if(carPaused()) return;
    CAR.elapsed+=dt; var p=$("cprog"); if(p) p.style.width=Math.min(100,CAR.elapsed/(CAR.secs*1000)*100)+"%";
    if(CAR.elapsed>=CAR.secs*1000) carShow(CAR.i+1,true);
  },200);
}
function carStop(){ if(CAR.iv){clearInterval(CAR.iv);CAR.iv=null;} }
function renderCar(){
  carView.innerHTML='<div class="chead"><div><div class="kick">Carousel</div><div class="muted" style="font-size:12px"><span id="cstate"></span> <span id="clive" class="sr" aria-live="polite"></span></div></div><div class="ctl"><span class="muted" style="font-size:11px">Every</span>'+
    [10,20,60].map(function(n){return '<button type="button" class="pillb" data-s="'+n+'" aria-pressed="'+(n===CAR.secs)+'">'+n+'s</button>';}).join("")+
    '<button type="button" class="pillb" id="cprev" aria-label="Previous card">Prev</button><button type="button" class="pillb" id="cpause" aria-pressed="false">Pause</button><button type="button" class="pillb" id="cnext" aria-label="Next card">Next</button><button type="button" class="pillb" id="cfs" hidden>Fullscreen</button></div></div>'+
    '<div class="stage" id="cstage" title="Tap to pause or play"></div><div class="prog"><i id="cprog"></i></div><div class="dots" id="cdots" aria-hidden="true"></div>';
  carView.querySelector(".ctl").addEventListener("click",function(e){var b=e.target.closest("button[data-s]"); if(!b) return; CAR.secs=+b.getAttribute("data-s"); ls("car-secs",String(CAR.secs)); CAR.elapsed=0;
    Array.prototype.forEach.call(carView.querySelectorAll("button[data-s]"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");}); });
  $("cprev").addEventListener("click",function(){carShow(CAR.i-1,true);}); $("cnext").addEventListener("click",function(){carShow(CAR.i+1,true);});
  $("cpause").addEventListener("click",function(){CAR.manual=!CAR.manual; carPaint();});
  var st=$("cstage");
  st.addEventListener("click",function(e){ if(e.target.closest("button,a,input,textarea,select")) return; CAR.manual=!CAR.manual; carPaint(); });
  st.addEventListener("pointerenter",function(e){ if(e.pointerType==="mouse"){CAR.hover=true; carPaint();} });
  st.addEventListener("pointerleave",function(e){ if(e.pointerType==="mouse"){CAR.hover=false; carPaint();} });
  var fs=$("cfs"), de=document.documentElement;
  if(de.requestFullscreen){ fs.hidden=false; fs.addEventListener("click",function(){
    try{ var p=document.fullscreenElement?document.exitFullscreen():de.requestFullscreen(); if(p&&p.catch) p.catch(function(){fs.hidden=true;}); }catch(e){fs.hidden=true;} }); }
  carShow(CAR.i,false); carPaint(); carRun();
}

/* ---- views and routing ---- */
function setView(v){
  view=v; homeView.hidden=v!=="home"; carView.hidden=v!=="car"; meetView.hidden=v!=="meet"; allView.hidden=v!=="all"; homeBtn.hidden=v==="home";
  if(v!=="car") carStop(); if(v!=="meet"){ timerStop(false); }
  clockEl.hidden=!(v==="meet"&&MC.start);
}
function route(){
  var h=(location.hash||"").replace(/^#/,"");
  if(h==="carousel"){ setView("car"); renderCar(); return; }
  if(MODES[h]){ if(mode!==h){ if(mode&&MC.start) clockReset(); mode=h; tileIdx=-1; showSolved=false; } setView("meet"); renderMeet(); return; }
  var i=-1; cards.forEach(function(c,j){if(c.id===h)i=j;});
  if(h==="all"||i>=0){ setView("all"); go(i>=0?i:cur,true); return; }
  setView("home");
}
window.addEventListener("hashchange",route);
document.addEventListener("keydown",function(e){
  if(view!=="car"||e.altKey||e.ctrlKey||e.metaKey) return;
  var t=e.target&&e.target.tagName; if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT"||t==="BUTTON") return;
  if(e.key==="ArrowRight"){carShow(CAR.i+1,true);} else if(e.key==="ArrowLeft"){carShow(CAR.i-1,true);} else if(e.key===" "){e.preventDefault(); CAR.manual=!CAR.manual; carPaint();}
});
route();
/* comments capability: composer only, the shell shows threads */
(async function(){
  var c=null;
  try{ if(window.claude&&typeof window.claude.use==="function"){ c=await window.claude.use("comments"); } }catch(e){ c=null; }
  if(c&&typeof c.openComposer==="function"){ window.__comments=c; noteBtns.forEach(function(b){b.hidden=false;}); }
})();
})();
</script>
