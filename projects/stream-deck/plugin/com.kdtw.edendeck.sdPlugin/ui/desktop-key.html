<!doctype html>
<html>
<head lang="en"><meta charset="utf-8" /><title>Desktop key</title><script src="sdpi-components.js"></script></head>
<body>
	<sdpi-item label="Press does">
		<sdpi-radio setting="mode" default="shortcut">
			<option value="shortcut">Control + number</option>
			<option value="app">Open an app instead</option>
		</sdpi-radio>
	</sdpi-item>
	<sdpi-item label="Desktop number">
		<sdpi-select setting="number" default="1">
			<option value="1">1</option><option value="2">2</option><option value="3">3</option>
			<option value="4">4</option><option value="5">5</option><option value="6">6</option>
			<option value="7">7</option><option value="8">8</option><option value="9">9</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="Label"><sdpi-textfield setting="label" maxlength="12" placeholder="Agenda"></sdpi-textfield></sdpi-item>
	<sdpi-item label="App name"><sdpi-textfield setting="app" placeholder="only for 'Open an app instead'"></sdpi-textfield></sdpi-item>
	<sdpi-item><p>Full-screen and split-screen desktops get no Control + number shortcut. Use "Open an app instead" for those.</p></sdpi-item>
</body>
</html>
