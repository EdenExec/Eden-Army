<title>Eden Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Eden Hub v1 (Q, 19 Nov 2026). The team's front door: one column of quiet tiles under a tab rail; the scoreboard is the only black object.
   Tokens are the Command Center's (projects/virtual-office/draft/office/page.css) so the two read as one house. Marlowe owns the design pass. */
:root{
  --floor:#F3F0E8; --paper:#FCFBF7; --ink:#141412; --mute:#5E5B54; --line:#D9D4C8; --soft:#EAE6DC;
  --g:#2A7A4B; --r:#A3372B; --a:#8C5F0A;
  --bd:#141412; --bd-fg:#F3F0E8; --bd-mute:#A59F92; --bd-line:#34322C;
  --sans:'Montserrat','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --floor:#121210; --paper:#1B1A17; --ink:#EEEBE3; --mute:#A8A397; --line:#33312B; --soft:#201F1B;
  --g:#86C29C; --r:#E39183; --a:#D6AA62; --bd:#0A0A09; --bd-fg:#EEEBE3; --bd-mute:#A59F92; --bd-line:#2D2B26; color-scheme:dark}}
:root[data-theme="dark"]{
  --floor:#121210; --paper:#1B1A17; --ink:#EEEBE3; --mute:#A8A397; --line:#33312B; --soft:#201F1B;
  --g:#86C29C; --r:#E39183; --a:#D6AA62; --bd:#0A0A09; --bd-fg:#EEEBE3; --bd-mute:#A59F92; --bd-line:#2D2B26; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--floor);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 56px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.eyebrow{font:500 10.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.stamp{font:500 11px/1.5 var(--mono);letter-spacing:.03em;color:var(--mute)}
.small{font-size:12.5px;color:var(--mute)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:18px}
.mark{display:flex;flex-direction:column;gap:6px;min-width:0}
.mark .org{font-weight:700;font-size:clamp(11px,1.6vw,13px);letter-spacing:.3em;line-height:1.1}
.mark h1{font-weight:700;font-style:italic;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:-.01em}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0;text-align:right}
.who b{font-weight:600}

.rail{overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--floor);margin-top:-8px}
@media (min-width:601px){.rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--floor)}}
.rail::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;min-width:max-content}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;min-height:44px;cursor:pointer;
  font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
@media (max-width:600px){
  .rail{border-bottom:0;overflow:visible;margin-top:-4px}
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-width:0;gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .tab{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 4px;font-size:10px;letter-spacing:.1em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--paper)}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--floor);border-bottom-color:var(--line)}}

.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid>*{min-width:0}
.tile{background:var(--paper);border:1px solid var(--line);min-width:0}
.tile>summary,.tile>.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.tile>summary>.stamp{margin-left:auto}
.tile>summary{cursor:pointer;list-style:none}
.tile>summary::-webkit-details-marker{display:none}
.tile>summary::after{content:"+";font:500 15px/1 var(--mono);color:var(--mute);width:12px;text-align:right;flex:none}
.tile>summary:hover::after{color:var(--ink)}
.tile[open]>summary::after{content:"\2212"}
.tile:not([open])>summary{border-bottom:0}
.tile h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tile .bd{padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:600px){.tile>summary,.tile>.hd{padding:13px 16px}.tile .bd{padding:16px}}
.lead{font-size:clamp(24px,3.6vw,32px);font-weight:700;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.quote{font-size:clamp(17px,2.2vw,19px);font-weight:500;line-height:1.45;max-width:56ch;padding-left:14px;border-left:2px solid var(--ink)}
.coming{border:0;border-left:2px solid var(--line);padding:10px 14px;color:var(--mute);font:500 13px/1.5 var(--sans);background:var(--soft);max-width:72ch}
.coming[role=status]{border-left-width:3px;background:var(--paper)}
.chip{display:inline-block;border:1px solid var(--line);padding:3px 8px;font:500 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.chip.hot{border-color:var(--ink);color:var(--ink)}
.chip.warn{border-color:var(--a);color:var(--a)}
.chip.ok{border-color:var(--g);color:var(--g)}

.rows{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.row .t{min-width:0;flex:1 1 220px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.row .t b{font-weight:600}
a.go{text-decoration:none;font-weight:600;border-bottom:1px solid var(--line);align-self:flex-start;transition:border-color .12s}
a.go:hover{border-bottom-color:var(--ink)}
a.go::after{content:" \2197";font-weight:500;color:var(--mute)}
.row .r{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--floor);padding:0 14px;min-height:38px;cursor:pointer;font:600 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.btn.q{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.q:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.s{min-height:30px;padding:0 10px;font-size:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font:500 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:38px;padding:8px 10px;background:var(--floor);border:1px solid var(--line);border-radius:0}
textarea{min-height:72px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline>input,.inline>select{flex:1 1 180px;width:auto;min-width:0}

/* the scoreboard: matte black in both themes, Augusta style */
.board{background:var(--bd);color:var(--bd-fg);border:1px solid var(--bd-line);border-top:3px double var(--bd-mute);min-width:0;counter-reset:pos}
.board .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--bd-line)}
.board h2{font-size:12.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
.board .src{font:500 10.5px/1.6 var(--mono);color:var(--bd-mute);padding:12px 20px;border-top:1px solid var(--bd-line)}
.board .scroll{overflow-x:auto}
.board table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bd-mute);text-align:right;padding:10px 14px;border-bottom:1px solid var(--bd-line);white-space:nowrap}
.board td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--bd-line);font:500 17px/1.2 var(--mono);white-space:nowrap}
.board tbody tr{counter-increment:pos}
.board td:first-child::before{content:counter(pos);display:inline-block;width:2.2em;font:500 11px/1 var(--mono);letter-spacing:0;color:var(--bd-mute)}
.board th:first-child{padding-left:calc(14px + 2.2em * 11 / 10)}
.board th:first-child,.board td:first-child{position:sticky;left:0;background:var(--bd);z-index:1}
.board tbody tr:first-child td:first-child::before{color:var(--bd-fg)}
.board th:first-child,.board td:first-child{text-align:left}
.board td:first-child{font:700 13px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase}
.board tr:last-child td{border-bottom:0}
.board td.z{color:var(--bd-mute)}
.board .none{padding:18px 20px;font:500 13px/1.5 var(--sans);color:var(--bd-mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--paper);padding:1px}
.stat{background:var(--paper);box-shadow:0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font:500 28px/1.05 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.scroll{overflow-x:auto}
table.plain{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.plain th{font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.plain td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.plain td.n,table.plain th.n{text-align:right}
table.plain input[type=text],table.plain select{min-width:110px}

.chans{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px}
@media (max-width:720px){.chans{grid-template-columns:minmax(0,1fr)}.chanlist{flex-direction:row!important;overflow-x:auto}.chanlist button{white-space:nowrap}}
.chanlist{display:flex;flex-direction:column;gap:2px}
.chanlist button{text-align:left;background:none;border:0;border-left:2px solid transparent;padding:9px 10px;cursor:pointer;color:var(--mute);font-weight:500}
.chanlist button[aria-pressed="true"]{color:var(--ink);border-left-color:var(--ink);font-weight:700}
@media (max-width:720px){.chanlist{border-bottom:1px solid var(--line)}.chanlist button{border-left:0;border-bottom:2px solid transparent;min-height:44px;padding:9px 12px}.chanlist button[aria-pressed="true"]{border-bottom-color:var(--ink)}}
.post{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.post:first-child{border-top:0}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:18px;height:18px;min-height:0;margin-top:2px;flex:none;accent-color:var(--ink)}
.task span{overflow-wrap:anywhere}
.md h3{font-size:13px;font-weight:700;margin-top:6px}
.md ul{margin:0;padding-left:18px}
.md p,.md li{max-width:68ch}

.rest{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px 0}
.rest h2{font-size:clamp(22px,4vw,32px);font-weight:700;letter-spacing:.04em}
.rest p{max-width:46ch;color:var(--mute)}
.cross{width:24px;height:40px;position:relative;margin:0 auto;padding:0 18px;box-sizing:content-box;background:var(--floor)}
.cross::before,.cross::after{content:"";position:absolute;background:var(--ink)}
.cross::before{left:calc(18px + 11px);top:0;width:2px;height:40px}
.cross::after{left:18px;top:11px;width:24px;height:2px}
.foot{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:0;margin-top:40px;border-top:1px solid var(--line)}
.foot .cross{margin-top:-20px;margin-bottom:10px}
.foot .verse{font-style:italic;font-weight:500;font-size:15px;line-height:1.55;max-width:44ch;text-wrap:balance}
.foot .id{margin-top:10px}
.foot .id{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:no-preference){.tab{transition:color .12s}}
</style>

<div class="wrap">
  <header class="top">
    <div class="mark">
      <span class="org">EDEN PARTNER GROUP</span>
      <h1>Eden Hub</h1>
    </div>
    <div class="who">
      <span id="who-name"><b>Signing you in</b></span>
      <span class="eyebrow" id="who-role">&nbsp;</span>
      <span class="stamp" id="sync"></span>
    </div>
  </header>
  <nav class="rail" aria-label="Sections"><div class="tabs" id="tabs" role="tablist"></div></nav>
  <main class="view" id="view"></main>
  <footer class="foot">
    <div class="cross" aria-hidden="true"></div>
    <p class="verse" id="verse">Whatever you do, work at it with all your heart.</p>
    <span class="eyebrow" id="verse-ref">Colossians 3:23</span>
    <div class="id eyebrow"><span>edenpartnergroup.com</span><span>EDEN PARTNER GROUP</span></div>
  </footer>
</div>

function typing() { var a = document.activeElement; return !!(a && a !== document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && document.getElementById('view').contains(a)); }
var queued = false;
function render(force) { if (force === true) { paint(); return; } if (queued) return; queued = true; requestAnimationFrame(function () { queued = false; if (typing()) { S.dirty = true; return; } paint(); }); }
function paint() {
  S.dirty = false;
  var sab = isSabbathAt(Date.now()), view = document.getElementById('view'), tabs = document.getElementById('tabs'), r = role();
  document.getElementById('who-name').textContent = ''; document.getElementById('who-name').appendChild(h('b', { text: S.ready ? (first(S.me.name) || (S.me.isOwner ? 'Kev' : 'Guest')) : 'Signing you in' }));
  document.getElementById('who-role').textContent = S.ready ? (r === 'none' ? 'Not on the roster' : r) + (S.viewAs ? ' · preview' : '') : ' ';
  document.getElementById('sync').textContent = !S.ready ? '' : !S.db ? 'Offline copy · open in claude.ai for live data' : S.slow ? 'Data cannot be reached yet · still trying' : '';
  var C = S.content.home, cf = C && C.cross_footer; if (cf && cf.line) { document.getElementById('verse').textContent = cf.line; document.getElementById('verse-ref').textContent = cf.reference || ''; }
  tabs.textContent = '';
  if (sab) { tabs.parentNode.hidden = true; view.textContent = ''; viewRest().forEach(function (n) { view.appendChild(n); }); return; }
  tabs.parentNode.hidden = false;
  if (!can(S.tab)) S.tab = 'home';
  TABS.forEach(function (t) { if (!can(t[0])) return; tabs.appendChild(h('button', { class: 'tab', type: 'button', role: 'tab', id: 'tab-' + t[0], 'aria-selected': S.tab === t[0] ? 'true' : 'false', text: t[1], onclick: function () { go(t[0]); } })); });
  var y = window.scrollY, nodes = VIEWS[S.tab]();
  view.textContent = '';
  if (S.msg) view.appendChild(h('div', { class: 'coming', role: 'status', style: 'border-style:solid;border-color:var(--ink);color:var(--ink)', text: S.msg }));
  nodes.forEach(function (n) { if (n) view.appendChild(n); });
  window.scrollTo(0, y); resolveNames();
}
function go(tab) { S.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; } window.scrollTo(0, 0); render(true); }
function fromHash() { var t = (location.hash || '').replace('#', ''); if (VIEWS[t]) S.tab = t; }
document.addEventListener('focusout', function () { setTimeout(function () { if (S.dirty && !typing()) paint(); }, 0); });
window.addEventListener('hashchange', function () { fromHash(); render(true); });
setInterval(function () { render(); }, 60000);   /* so the Sabbath state begins and ends on time */

/* ---------- boot: render first, light up when the capabilities answer ---------- */
function listen(db) {
  function col(path, into, flag) { db.collection(path).onSnapshot(function (s) { var o = {}; s.docs.forEach(function (d) { o[d.id] = d.data(); }); S[into] = o; if (flag) S.loaded[flag] = true; if (!s.metadata.fromCache) S.slow = false; render(); }, function () { if (flag) S.loaded[flag] = true; render(); }); }
  function one(path, into, flag) { db.doc(path).onSnapshot(function (s) { S[into] = s.exists ? s.data() : null; if (flag) S.loaded[flag] = true; if (into === 'roles') { S.draftRoles = typing() ? S.draftRoles : null; claimOwner(); } render(); }, function () { if (flag) S.loaded[flag] = true; render(); }); }
  col('content', 'content', 'content'); one('roles/current', 'roles', 'roles'); one('board/current', 'board', 'board'); one('phones/current', 'phones', 'phones');
  col('links', 'links', 'links'); one('president/links', 'plinks', 'plinks'); col('posts', 'posts'); col('checkouts', 'checkouts'); col('tickets', 'allTickets');
  if (S.me.id) { one('tickets/' + S.me.id, 'myTickets'); one('data/users/' + S.me.id + '/desk', 'desk'); }
  setTimeout(function () { if (!S.loaded.content) { S.slow = true; render(); } }, 10000);
}
/* Once, on Kev's first visit: record the owner's id so everyone's page can tell his announcements are his. */
var claimed = false;
function claimOwner() { if (claimed || !S.me.isOwner || !S.me.id || !S.roles || S.roles.owner_id === S.me.id) return; claimed = true; S.db.doc('roles/current').update({ owner_id: S.me.id }).catch(function () {}); }
function boot() {
  fromHash(); paint();
  var c = window.claude;
  if (!c || !c.use) { S.ready = true; paint(); return; }
  Promise.all([c.use('user'), c.use('db')]).then(function (r) {
    S.user = r[0]; S.db = r[1];
    return (S.user ? S.user.me() : Promise.resolve(null)).then(function (me) {
      if (me) S.me = { id: me.id, name: me.name || '', email: me.email, isOwner: !!me.isOwner, canEdit: !!me.canEdit };
      S.ready = true; if (S.db) listen(S.db); paint();
    });
  }).catch(function () { S.ready = true; paint(); });
}
boot();
})();
